<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sherlock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Широкий растянутый шрифт Unbounded -->
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --main-color: #f7e479;
            --main-color-opacity: rgba(247, 228, 121, 0.12);
            --total-radio: 6;

            /* 🌑 ЧИСТЫЙ СЕРЫЙ ГРАФИТ */
            --bg: #0c0c0e;
            --surface: rgba(26, 26, 30, 0.65);
            --border: rgba(255, 255, 255, 0.08);

            --text-main: #f0f2f5;
            --text-muted: #64646e;

            --font-stretched: 'Unbounded', sans-serif;
            --font-ui: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-ui);
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            background-color: var(--bg);
            background-image: none;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 🔘 ЧИСТАЯ СТАТИЧНАЯ SVG КНОПКА МЕНЮ */
        .hud-menu-btn {
            position: fixed;
            top: 28px;
            left: 28px;
            z-index: 90;
            background: transparent;
            border: none;
            padding: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.35);
            transition: color 0.3s ease, filter 0.3s ease;
        }

        .hud-menu-btn svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
        }

        @media (hover: hover) and (pointer: fine) {
            .hud-menu-btn:hover,
            .hud-menu-btn.active {
                color: var(--main-color);
                filter: drop-shadow(0 0 8px rgba(247, 228, 121, 0.5));
            }
        }

        /* 🪟 ЗАТЕМНЕНИЕ ФОНА */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s var(--ease), visibility 0.3s;
            z-index: 100;
        }

        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* 🚪 БОКОВАЯ ПАНЕЛЬ */
        .side-drawer {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 290px;
            background: rgba(16, 16, 19, 0.98);
            border-right: 1px solid var(--border);
            backdrop-filter: blur(30px);
            z-index: 110;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            visibility: hidden;
            box-shadow: none;
            transition: transform 0.3s var(--ease), visibility 0.3s, box-shadow 0.3s;
        }

        .side-drawer.active {
            transform: translateX(0);
            visibility: visible;
            box-shadow: 20px 0 60px rgba(0, 0, 0, 0.9);
        }

        .drawer-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .drawer-brand {
            font-family: var(--font-stretched);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: var(--main-color);
            text-transform: uppercase;
        }

        .drawer-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.2s;
        }

        .drawer-close:hover {
            color: #fff;
        }

        /* 🌟 ЛАЗЕРНЫЙ ГЛАЙДЕР НА 6 ПОЗИЦИЙ */
        .radio-container {
            --total-radio: 6;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-left: 0.5rem;
        }

        .radio-container input {
            cursor: pointer;
            appearance: none;
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .radio-container .glider-container {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255,255,255,0.15) 50%, rgba(0,0,0,0) 100%);
            width: 1.5px;
        }

        .radio-container .glider-container .glider {
            position: relative;
            height: calc(100% / var(--total-radio));
            width: 100%;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, var(--main-color) 50%, rgba(0,0,0,0) 100%);
            transition: transform 0.4s cubic-bezier(0.37, 1.4, 0.66, 1);
        }

        .radio-container .glider-container .glider::before {
            content: "";
            position: absolute;
            height: 60%;
            width: 350%;
            top: 50%;
            transform: translateY(-50%);
            background: var(--main-color);
            filter: blur(8px);
        }

        .radio-container .glider-container .glider::after {
            content: "";
            position: absolute;
            left: 0;
            height: 100%;
            width: 160px;
            background: linear-gradient(90deg, var(--main-color-opacity) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        .radio-container label {
            cursor: pointer;
            padding: 0.85rem 1.1rem;
            position: relative;
            color: #686873;
            font-size: 13.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: color 0.25s ease;
            user-select: none;
        }

        .radio-container label svg {
            width: 16px;
            height: 16px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
        }

        .radio-container input:checked + label {
            color: var(--main-color);
        }

        .radio-container input:nth-of-type(1):checked ~ .glider-container .glider { transform: translateY(0); }
        .radio-container input:nth-of-type(2):checked ~ .glider-container .glider { transform: translateY(100%); }
        .radio-container input:nth-of-type(3):checked ~ .glider-container .glider { transform: translateY(200%); }
        .radio-container input:nth-of-type(4):checked ~ .glider-container .glider { transform: translateY(300%); }
        .radio-container input:nth-of-type(5):checked ~ .glider-container .glider { transform: translateY(400%); }
        .radio-container input:nth-of-type(6):checked ~ .glider-container .glider { transform: translateY(500%); }

        /* ⎯⎯⎯ РАБОЧАЯ ОБЛАСТЬ ⎯⎯⎯ */
        .workspace {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            padding: 110px 20px 80px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .title-block {
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-family: var(--font-stretched);
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.01em;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* 🔍 СТРОКА ВВОДА */
        .input-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .field-input {
            flex: 1;
            height: 44px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: none;
        }

        .field-input:focus {
            outline: none;
            box-shadow: none;
            border-color: var(--border);
            background: var(--surface);
        }

        .field-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        /* 🌟 КНОПКА ПОИСКА */
        .menu-style-btn {
            background: linear-gradient(90deg, rgba(247, 228, 121, 0.08) 0%, rgba(26, 26, 30, 0.85) 100%);
            border: 1px solid rgba(247, 228, 121, 0.35);
            border-radius: 10px;
            height: 44px;
            padding: 0 24px;
            color: var(--main-color);
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 0 16px rgba(247, 228, 121, 0.12), inset 0 0 10px rgba(247, 228, 121, 0.05);
            transition: filter 0.2s ease, opacity 0.2s ease;
            user-select: none;
        }

        @media (hover: hover) and (pointer: fine) {
            .menu-style-btn:hover {
                filter: brightness(0.85);
                opacity: 0.9;
            }
        }

        @media (hover: none) {
            .menu-style-btn,
            .menu-style-btn:active,
            .menu-style-btn:focus,
            .menu-style-btn:hover {
                filter: none;
                opacity: 1;
                border-color: rgba(247, 228, 121, 0.35);
                box-shadow: 0 0 16px rgba(247, 228, 121, 0.12), inset 0 0 10px rgba(247, 228, 121, 0.05);
            }
        }

        /* 📋 РЕЗУЛЬТАТЫ */
        .results-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 10px;
        }

        .meta-line {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .deck-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
        }

        .deck-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 13px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        @media (hover: hover) and (pointer: fine) {
            .deck-card {
                transition: border-color 0.2s ease;
            }
            .deck-card:hover {
                border-color: rgba(255, 255, 255, 0.16);
            }
            .deck-card svg {
                transition: stroke 0.2s ease;
            }
            .deck-card:hover svg {
                stroke: #ffffff;
            }
        }

        .deck-card svg {
            width: 13px;
            height: 13px;
            stroke: var(--text-muted);
            flex-shrink: 0;
        }

        .data-table {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 18px;
            border-bottom: 1px solid var(--border);
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .data-key {
            font-size: 13px;
            color: var(--text-muted);
        }

        .data-val-group {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 65%;
        }

        .data-val {
            font-family: var(--font-mono);
            font-size: 13px;
            color: #ffffff;
            word-break: break-all;
            text-align: right;
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 4px;
            border-radius: 4px;
        }

        @media (hover: hover) and (pointer: fine) {
            .copy-btn {
                transition: color 0.15s ease;
            }
            .copy-btn:hover {
                color: #ffffff;
            }
        }

        .copy-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .blank-state {
            padding: 50px 0;
            color: var(--text-muted);
            font-size: 13px;
            font-family: var(--font-mono);
            text-align: center;
        }

        .spinner {
            display: none;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(247, 228, 121, 0.2);
            border-top-color: var(--main-color);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: #0c0c0e;
            font-size: 12px;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 120;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .hud-menu-btn { top: 20px; left: 20px; }
            .workspace { padding: 90px 16px 40px; }
            .deck-grid { grid-template-columns: 1fr; }
            .main-title { font-size: 21px; }
        }
    </style>
</head>
<body>

    <!-- 🔘 ЧИСТАЯ СТАТИЧНАЯ ИКОНКА МЕНЮ -->
    <button class="hud-menu-btn" id="menuBtn" onclick="toggleMenu()" title="Инструменты">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="16" y2="12"></line>
            <line x1="3" y1="18" x2="20" y2="18"></line>
        </svg>
    </button>

    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleMenu()"></div>

    <!-- ВЫЕЗЖАЮЩАЯ СЛЕВА ПАНЕЛЬ (6 ПУНКТОВ) -->
    <aside class="side-drawer" id="sideDrawer">
        <div class="drawer-head">
            <span class="drawer-brand">Инструменты</span>
            <button class="drawer-close" onclick="toggleMenu()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="radio-container">
            <input type="radio" id="tool-sub" name="osint-radio" value="subdomains" checked onchange="selectTool(this)">
            <label for="tool-sub">
                <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                <span>Субдомены</span>
            </label>

            <!-- ✈️ ПО TELEGRAM (ВМЕСТО НИКНЕЙМА) -->
            <input type="radio" id="tool-tg" name="osint-radio" value="telegram" onchange="selectTool(this)">
            <label for="tool-tg">
                <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                <span>По TELEGRAM</span>
            </label>

            <!-- 📞 ПО НОМЕРУ (НОВАЯ ФУНКЦИЯ) -->
            <input type="radio" id="tool-phone" name="osint-radio" value="phone" onchange="selectTool(this)">
            <label for="tool-phone">
                <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                <span>По номеру</span>
            </label>

            <input type="radio" id="tool-dns" name="osint-radio" value="dns" onchange="selectTool(this)">
            <label for="tool-dns">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                <span>DNS записи</span>
            </label>

            <input type="radio" id="tool-ip" name="osint-radio" value="ip" onchange="selectTool(this)">
            <label for="tool-ip">
                <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                <span>IP хост</span>
            </label>

            <input type="radio" id="tool-mail" name="osint-radio" value="email" onchange="selectTool(this)">
            <label for="tool-mail">
                <svg viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
                <span>Почтовый адрес</span>
            </label>

            <div class="glider-container">
                <div class="glider"></div>
            </div>
        </div>
    </aside>

    <!-- 💻 ОТКРЫТАЯ РАБОЧАЯ ОБЛАСТЬ -->
    <main class="workspace">
        <div class="title-block">
            <h1 class="main-title" id="toolTitle">Субдомены</h1>
        </div>

        <div class="input-row">
            <input type="text" id="targetInput" class="field-input" placeholder="Корневой домен (например: spotify.com)..." autocomplete="off" spellcheck="false">
            <button class="menu-style-btn" id="runBtn" onclick="runInvestigation()">
                <span id="btnText">Поиск</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </div>

        <!-- РЕЗУЛЬТАТЫ -->
        <div class="results-section">
            <div class="meta-line" id="statusLine">Ожидание</div>
            <div id="resultsViewport">
                <div class="blank-state">Укажите цель для инициализации поиска</div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast">Скопировано в буфер</div>

    <script>
        let currentTool = 'subdomains';

        const toolConfig = {
            subdomains: {
                title: 'Субдомены',
                placeholder: 'Корневой домен (например: spotify.com)...'
            },
            telegram: {
                title: 'По TELEGRAM',
                placeholder: 'Юзернейм цели (например: durov)...'
            },
            phone: {
                title: 'По номеру',
                placeholder: 'Номер телефона (например: +79991234567)...'
            },
            dns: {
                title: 'DNS записи',
                placeholder: 'Домен для проверки (например: github.com)...'
            },
            ip: {
                title: 'IP хост',
                placeholder: 'IP адрес (например: 1.1.1.1)...'
            },
            email: {
                title: 'Почтовый адрес',
                placeholder: 'Email адрес (например: dev@apple.com)...'
            }
        };

        function toggleMenu() {
            const drawer = document.getElementById('sideDrawer');
            const overlay = document.getElementById('drawerOverlay');
            const menuBtn = document.getElementById('menuBtn');

            const isOpen = drawer.classList.toggle('active');
            overlay.classList.toggle('active');
            menuBtn.classList.toggle('active', isOpen);
        }

        function selectTool(radio) {
            currentTool = radio.value;
            const c = toolConfig[currentTool];

            document.getElementById('toolTitle').innerText = c.title;

            const input = document.getElementById('targetInput');
            input.placeholder = c.placeholder;
            input.value = '';

            document.getElementById('statusLine').innerText = 'Ожидание';
            document.getElementById('resultsViewport').innerHTML = `
                <div class="blank-state">Укажите цель для инициализации поиска</div>
            `;

            setTimeout(toggleMenu, 160);
        }

        function copyData(val) {
            navigator.clipboard.writeText(val);
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1500);
        }

        document.getElementById('targetInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') runInvestigation();
        });

        // Функция парсинга и определения номеров
        function parsePhoneNumber(raw) {
            const digits = raw.replace(/\D/g, '');
            let country = 'Международный / Неизвестно';
            let formatted = `+${digits}`;

            if (digits.startsWith('7')) {
                country = digits.length === 11 && digits[1] === '7' ? 'Казахстан' : 'Россия';
                if (digits.length === 11) {
                    formatted = `+7 (${digits.slice(1,4)}) ${digits.slice(4,7)}-${digits.slice(7,9)}-${digits.slice(9,11)}`;
                }
            } else if (digits.startsWith('380')) {
                country = 'Украина';
                formatted = `+380 (${digits.slice(3,5)}) ${digits.slice(5,8)}-${digits.slice(8,10)}-${digits.slice(10,12)}`;
            } else if (digits.startsWith('375')) {
                country = 'Беларусь';
                formatted = `+375 (${digits.slice(3,5)}) ${digits.slice(5,8)}-${digits.slice(8,10)}-${digits.slice(10,12)}`;
            } else if (digits.startsWith('1')) {
                country = 'США / Канада';
                formatted = `+1 (${digits.slice(1,4)}) ${digits.slice(4,7)}-${digits.slice(7,11)}`;
            } else if (digits.startsWith('44')) {
                country = 'Великобритания';
            } else if (digits.startsWith('49')) {
                country = 'Германия';
            }

            return { digits, country, formatted };
        }

        async function runInvestigation() {
            const query = document.getElementById('targetInput').value.trim();
            if (!query) return;

            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const resultsViewport = document.getElementById('resultsViewport');
            const statusLine = document.getElementById('statusLine');

            btnText.style.display = 'none';
            spinner.style.display = 'block';
            statusLine.innerText = 'Обработка запроса...';

            try {
                let html = '';

                // ✈️ 1. TELEGRAM
                if (currentTool === 'telegram') {
                    const u = query.replace('@', '').trim();
                    const tgHub = [
                        { name: "Telegram Профиль", sub: `t.me/${u}`, url: `https://t.me/${u}` },
                        { name: "Web Просмотр ленты", sub: "Предпросмотр постов", url: `https://t.me/s/${u}` },
                        { name: "Аналитика TGStat", sub: "Рейтинг канала/чата", url: `https://tgstat.ru/channel/@${u}` },
                        { name: "Аналитика Telemetr", sub: "Статистика аудитории", url: `https://telemetr.me/channels/?r=${u}` },
                        { name: "База постов Lyzem", sub: "Глобальный архив", url: `https://lyzem.com/search?q=${u}` },
                        { name: "Telegram Web Client", sub: "Открыть в браузере", url: `https://web.telegram.org/k/#?tgaddr=tg%3A%2F%2Fresolve%3Fdomain%3D${u}` }
                    ];

                    statusLine.innerText = `Telegram: @${u}`;
                    html += '<div class="deck-grid">';
                    for (const p of tgHub) {
                        html += `
                            <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="deck-card">
                                <div>
                                    <div style="font-weight: 600;">${p.name}</div>
                                    <div style="font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 2px;">${p.sub}</div>
                                </div>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="7" y1="17" x2="17" y2="7"></line>
                                    <polyline points="7 7 17 7 17 17"></polyline>
                                </svg>
                            </a>
                        `;
                    }
                    html += '</div>';
                }
                // 📞 2. ПО НОМЕРУ ТЕЛЕФОНА
                else if (currentTool === 'phone') {
                    const info = parsePhoneNumber(query);
                    statusLine.innerText = `Номер: +${info.digits}`;

                    const messengers = [
                        { name: "WhatsApp Диалог", sub: "wa.me прямой чат", url: `https://wa.me/${info.digits}` },
                        { name: "Telegram Поиск", sub: "t.me по номеру", url: `https://t.me/+${info.digits}` },
                        { name: "Viber Чат", sub: "viber direct chat", url: `viber://chat?number=%2B${info.digits}` }
                    ];

                    html += '<div class="data-table" style="margin-bottom: 12px;">';
                    const phoneProps = [
                        ['Страна / Регион', info.country],
                        ['Форматированный вид', info.formatted],
                        ['Международный формат', `+${info.digits}`]
                    ];

                    phoneProps.forEach(([k, v]) => {
                        html += `
                            <div class="data-row">
                                <span class="data-key">${k}</span>
                                <div class="data-val-group">
                                    <span class="data-val">${v}</span>
                                    <button class="copy-btn" onclick="copyData('${v}')">
                                        <svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';

                    html += '<div class="deck-grid">';
                    for (const m of messengers) {
                        html += `
                            <a href="${m.url}" target="_blank" rel="noopener noreferrer" class="deck-card">
                                <div>
                                    <div style="font-weight: 600;">${m.name}</div>
                                    <div style="font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 2px;">${m.sub}</div>
                                </div>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="7" y1="17" x2="17" y2="7"></line>
                                    <polyline points="7 7 17 7 17 17"></polyline>
                                </svg>
                            </a>
                        `;
                    }
                    html += '</div>';
                }
                // 🌐 3. СУБДОМЕНЫ
                else if (currentTool === 'subdomains') {
                    const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const res = await fetch(`https://crt.sh/?q=%25.${encodeURIComponent(cleanDomain)}&output=json`);
                    const data = await res.json();
                    const subSet = new Set();

                    data.slice(0, 36).forEach(item => {
                        item.name_value.split('\n').forEach(s => {
                            s = s.trim().toLowerCase();
                            if (!s.includes('*') && s.endsWith(cleanDomain)) subSet.add(s);
                        });
                    });

                    const list = Array.from(subSet);
                    if (list.length > 0) {
                        statusLine.innerText = `Найдено: ${list.length} поддоменов`;
                        html += '<div class="deck-grid">';
                        for (const sub of list) {
                            html += `
                                <div class="deck-card" onclick="copyData('${sub}')" style="cursor: pointer;">
                                    <span style="font-family: var(--font-mono); font-size: 12px;">${sub}</span>
                                    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                        <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                                        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
                                    </svg>
                                </div>
                            `;
                        }
                        html += '</div>';
                    } else {
                        html = '<div class="blank-state">В открытых реестрах записей не обнаружено</div>';
                        statusLine.innerText = '0 результатов';
                    }
                }
                // 📡 4. DNS
                else if (currentTool === 'dns') {
                    const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const types = ['A', 'AAAA', 'MX', 'TXT', 'NS'];
                    let found = 0;
                    let rows = '';

                    for (const t of types) {
                        try {
                            const res = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(cleanDomain)}&type=${t}`, {
                                headers: { 'Accept': 'application/dns-json' }
                            });
                            const data = await res.json();
                            if (data.Answer && data.Answer.length > 0) {
                                found++;
                                const valStr = data.Answer.map(a => a.data).join(', ');
                                rows += `
                                    <div class="data-row">
                                        <span class="data-key">${t}</span>
                                        <div class="data-val-group">
                                            <span class="data-val">${valStr}</span>
                                            <button class="copy-btn" title="Копировать" onclick="copyData('${valStr.replace(/'/g, "\\'")}')">
                                                <svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                                            </button>
                                        </div>
                                    </div>
                                `;
                            }
                        } catch (e) {}
                    }

                    if (found > 0) {
                        html = `<div class="data-table">${rows}</div>`;
                        statusLine.innerText = `Домен: ${cleanDomain}`;
                    } else {
                        html = '<div class="blank-state">Записи DNS не обнаружены</div>';
                        statusLine.innerText = '0 результатов';
                    }
                }
                // 📍 5. IP
                else if (currentTool === 'ip') {
                    const cleanTarget = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const res = await fetch(`https://freeipapi.com/api/json/${encodeURIComponent(cleanTarget)}`);
                    const data = await res.json();

                    statusLine.innerText = `IP: ${cleanTarget}`;

                    const rows = [
                        ['IP Хоста', data.ipAddress || cleanTarget],
                        ['Локация', `${data.countryName || '—'}, ${data.cityName || '—'}`],
                        ['Индекс зоны', data.zipCode || '—'],
                        ['Таймзона', data.timeZone || '—'],
                        ['Версия IP', data.ipVersion ? `IPv${data.ipVersion}` : '—']
                    ];

                    html += '<div class="data-table">';
                    rows.forEach(([k, v]) => {
                        html += `
                            <div class="data-row">
                                <span class="data-key">${k}</span>
                                <div class="data-val-group">
                                    <span class="data-val">${v}</span>
                                    <button class="copy-btn" onclick="copyData('${v}')">
                                        <svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }
                // ✉️ 6. EMAIL
                else if (currentTool === 'email') {
                    const cleanEmail = query.trim().toLowerCase();
                    const domain = cleanEmail.split('@')[1] || '—';
                    const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail);

                    statusLine.innerText = cleanEmail;

                    const rows = [
                        ['Целевой адрес', cleanEmail],
                        ['Доменная зона', domain],
                        ['Формат RFC 5322', isValid ? 'Валиден' : 'Ошибка формата']
                    ];

                    html += '<div class="data-table">';
                    rows.forEach(([k, v]) => {
                        html += `
                            <div class="data-row">
                                <span class="data-key">${k}</span>
                                <div class="data-val-group">
                                    <span class="data-val">${v}</span>
                                    <button class="copy-btn" onclick="copyData('${v}')">
                                        <svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                resultsViewport.innerHTML = html;
            } catch (e) {
                statusLine.innerText = 'Ошибка';
                resultsViewport.innerHTML = '<div class="blank-state">Сетевая ошибка или блок шлюза API</div>';
            } finally {
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
