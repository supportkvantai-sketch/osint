<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sherlock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --main-color: #f7e479;
            --main-color-opacity: rgba(247, 228, 121, 0.12);
            --total-radio: 5;

            /* Переменные из твоего сниппета */
            --login-box-color: #1a1a1e;
            --input-color: #26272e;
            --button-color: #2e303a;
            --bg: #090a0d;

            --font-ui: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-ui);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 15%, rgba(247, 228, 121, 0.04) 0%, transparent 50%),
                              radial-gradient(circle at 50% 90%, rgba(20, 24, 36, 0.6) 0%, transparent 60%);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            position: relative;
        }

        /* 🔘 ЧИСТАЯ SVG КНОПКА МЕНЮ (ПЛАВНЫЙ ПЕРЕХОД В ЖЕЛТЫЙ) */
        .menu-trigger {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 90;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.4);
            transition: color 0.3s var(--ease), filter 0.3s var(--ease), transform 0.3s var(--ease);
        }

        .menu-trigger svg {
            width: 26px;
            height: 26px;
            stroke-width: 2.2;
            stroke: currentColor;
            fill: none;
        }

        .menu-trigger:hover,
        .menu-trigger.active {
            color: var(--main-color);
            filter: drop-shadow(0 0 10px rgba(247, 228, 121, 0.6));
            transform: scale(1.08);
        }

        /* 🪟 ВЫЕЗЖАЮЩАЯ СЛЕВА ПАНЕЛЬ С ГЛАЙДЕРОМ */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s var(--ease);
            z-index: 100;
        }

        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .side-drawer {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            background: rgba(14, 15, 20, 0.92);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(30px);
            z-index: 110;
            padding: 30px 18px;
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.35s var(--ease);
            box-shadow: 20px 0 50px rgba(0, 0, 0, 0.8);
        }

        .side-drawer.active {
            transform: translateX(0);
        }

        .drawer-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 20px;
        }

        .drawer-brand {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--main-color);
            text-transform: uppercase;
        }

        .drawer-close {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.2s;
        }

        .drawer-close:hover {
            color: #fff;
        }

        /* 🌟 ЛАЗЕРНЫЙ ГЛАЙДЕР В МЕНЮ */
        .radio-container {
            --total-radio: 5;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-left: 0.5rem;
        }

        .radio-container input {
            cursor: pointer;
            appearance: none;
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .radio-container .glider-container {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255,255,255,0.15) 50%, rgba(0,0,0,0) 100%);
            width: 1.5px;
        }

        .radio-container .glider-container .glider {
            position: relative;
            height: calc(100% / var(--total-radio));
            width: 100%;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, var(--main-color) 50%, rgba(0,0,0,0) 100%);
            transition: transform 0.45s cubic-bezier(0.37, 1.4, 0.66, 1);
        }

        .radio-container .glider-container .glider::before {
            content: "";
            position: absolute;
            height: 60%;
            width: 350%;
            top: 50%;
            transform: translateY(-50%);
            background: var(--main-color);
            filter: blur(8px);
        }

        .radio-container .glider-container .glider::after {
            content: "";
            position: absolute;
            left: 0;
            height: 100%;
            width: 160px;
            background: linear-gradient(90deg, var(--main-color-opacity) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        .radio-container label {
            cursor: pointer;
            padding: 1rem 1.1rem;
            position: relative;
            color: #6c707d;
            font-size: 13.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.25s ease-in-out;
            user-select: none;
        }

        .radio-container label svg {
            width: 16px;
            height: 16px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
        }

        .radio-container input:checked + label {
            color: var(--main-color);
        }

        .radio-container input:nth-of-type(1):checked ~ .glider-container .glider { transform: translateY(0); }
        .radio-container input:nth-of-type(2):checked ~ .glider-container .glider { transform: translateY(100%); }
        .radio-container input:nth-of-type(3):checked ~ .glider-container .glider { transform: translateY(200%); }
        .radio-container input:nth-of-type(4):checked ~ .glider-container .glider { transform: translateY(300%); }
        .radio-container input:nth-of-type(5):checked ~ .glider-container .glider { transform: translateY(400%); }

        /* ⎯⎯⎯ ЦЕНТРАЛЬНАЯ ОБЛАСТЬ ⎯⎯⎯ */
        .main-wrapper {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 100px 20px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* 🌟 ТОТ САМЫЙ КОМПОНЕНТ ИЗ ТВОЕГО СНИППЕТА */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: var(--login-box-color);
            border-radius: 24px;
            width: 100%;
            padding: 1.5px; /* Зазор для вращающейся линии */
            z-index: 8;
            box-shadow:
                0 4px 8px rgba(0, 0, 0, 0.3),
                0 8px 16px rgba(0, 0, 0, 0.3),
                0 0 10px rgba(255, 255, 255, 0.08),
                0 0 20px rgba(255, 255, 255, 0.04);
        }

        .container::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            z-index: -2;
            background: conic-gradient(
                from 45deg,
                transparent 75%,
                var(--main-color) 92%,
                #ffffff 98%,
                transparent 100%
            );
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .login-box {
            background: var(--login-box-color);
            border-radius: 23px;
            padding: 30px 28px;
            width: 100%;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow:
                inset 0 40px 60px -8px rgba(255, 255, 255, 0.12),
                inset 4px 0 12px -6px rgba(255, 255, 255, 0.12),
                inset 0 0 12px -4px rgba(255, 255, 255, 0.12);
        }

        .form {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .header {
            width: 100%;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            padding: 4px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid transparent;
            border-radius: 12px;
            background: var(--input-color);
            color: white;
            outline: none;
            font-size: 14px;
            transition: all 0.25s;
        }

        .input:focus {
            border: 1px solid #fff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
        }

        .button {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--button-color);
            color: white;
            transition: 0.3s;
            box-shadow:
                inset 0px 3px 6px -4px rgba(255, 255, 255, 0.6),
                inset 0px -3px 6px -2px rgba(0, 0, 0, 0.8);
        }

        .button:hover {
            background: rgba(255, 255, 255, 0.25);
            box-shadow:
                inset 0px 3px 6px rgba(255, 255, 255, 0.6),
                inset 0px -3px 6px rgba(0, 0, 0, 0.8),
                0px 0px 10px rgba(255, 255, 255, 0.1);
        }

        .button:active {
            transform: scale(0.98);
        }

        /* ⎯⎯⎯ ВЫВОД РЕЗУЛЬТАТОВ ⎯⎯⎯ */
        .results-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-line {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0 4px;
        }

        /* Карточки выдачи в стиле коробки */
        .deck-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }

        .deck-card {
            background: var(--input-color);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .deck-card:hover {
            background: var(--button-color);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .deck-card svg {
            width: 13px;
            height: 13px;
            stroke: rgba(255, 255, 255, 0.4);
        }

        /* Строки таблицы для DNS/IP/Email */
        .table-box {
            background: var(--input-color);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .table-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .table-key {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
        }

        .table-val-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 65%;
        }

        .table-val {
            font-family: var(--font-mono);
            font-size: 13px;
            color: white;
            word-break: break-all;
            text-align: right;
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 4px;
            border-radius: 4px;
            transition: color 0.15s;
        }

        .copy-btn:hover {
            color: var(--main-color);
        }

        .copy-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .blank-text {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            font-family: var(--font-mono);
        }

        .spinner {
            display: none;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #ffffff;
            color: #000000;
            font-size: 12px;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 99px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s var(--ease);
            z-index: 120;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            .menu-trigger { top: 18px; left: 18px; }
            .main-wrapper { padding: 80px 16px 40px; }
            .deck-grid { grid-template-columns: 1fr; }
            .login-box { padding: 24px 20px; }
        }
    </style>
</head>
<body>

    <!-- 🔘 ЧИСТАЯ МИНИМАЛИСТИЧНАЯ SVG КНОПКА МЕНЮ -->
    <button class="menu-trigger" id="menuBtn" onclick="toggleMenu()" title="Открыть меню">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="16" y2="12"></line>
            <line x1="3" y1="18" x2="20" y2="18"></line>
        </svg>
    </button>

    <!-- ТЕМНЫЙ ФОН МЕНЮ -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleMenu()"></div>

    <!-- ВЫЕЗЖАЮЩАЯ СЛЕВА ПАНЕЛЬ С ЛАЗЕРНЫМ ГЛАЙДЕРОМ -->
    <aside class="side-drawer" id="sideDrawer">
        <div class="drawer-top">
            <span class="drawer-brand">Инструменты</span>
            <button class="drawer-close" onclick="toggleMenu()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="radio-container">
            <input type="radio" id="tool-sub" name="osint-radio" value="subdomains" checked onchange="selectTool(this)">
            <label for="tool-sub">
                <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                <span>Субдомены</span>
            </label>

            <input type="radio" id="tool-user" name="osint-radio" value="username" onchange="selectTool(this)">
            <label for="tool-user">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Никнейм</span>
            </label>

            <input type="radio" id="tool-dns" name="osint-radio" value="dns" onchange="selectTool(this)">
            <label for="tool-dns">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                <span>DNS записи</span>
            </label>

            <input type="radio" id="tool-ip" name="osint-radio" value="ip" onchange="selectTool(this)">
            <label for="tool-ip">
                <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                <span>IP хост</span>
            </label>

            <input type="radio" id="tool-mail" name="osint-radio" value="email" onchange="selectTool(this)">
            <label for="tool-mail">
                <svg viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
                <span>Почтовый адрес</span>
            </label>

            <div class="glider-container">
                <div class="glider"></div>
            </div>
        </div>
    </aside>

    <!-- 💻 ТОЧНАЯ РЕАЛИЗАЦИЯ ТВОЕГО СНИППЕТА -->
    <main class="main-wrapper">
        <div class="container">
            <div class="login-box">
                <div class="form">
                    <div class="header" id="boxTitle">Субдомены</div>
                    <input type="text" id="targetInput" class="input" placeholder="Корневой домен (например: spotify.com)..." autocomplete="off" spellcheck="false">
                    <button class="button" id="submitBtn" onclick="runInvestigation()">
                        <span id="btnText">Поиск</span>
                        <div class="spinner" id="spinner"></div>
                    </button>
                </div>
            </div>
        </div>

        <!-- 📋 РЕЗУЛЬТАТЫ -->
        <div class="results-container">
            <div class="status-line">
                <span id="statusCount">Ожидание ввода</span>
                <span id="statusCode">STANDBY</span>
            </div>
            <div id="resultsViewport">
                <div class="blank-text">— Введите цель выше для запуска анализа —</div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast">Скопировано в буфер</div>

    <script>
        let currentTool = 'subdomains';

        const toolConfig = {
            subdomains: {
                title: 'Субдомены',
                placeholder: 'Корневой домен (например: spotify.com)...'
            },
            username: {
                title: 'Никнейм',
                placeholder: 'Введите никнейм цели (например: durov)...'
            },
            dns: {
                title: 'DNS записи',
                placeholder: 'Домен для проверки (например: github.com)...'
            },
            ip: {
                title: 'IP хост',
                placeholder: 'IP адрес (например: 1.1.1.1)...'
            },
            email: {
                title: 'Почтовый адрес',
                placeholder: 'Email адрес (например: dev@apple.com)...'
            }
        };

        function toggleMenu() {
            const drawer = document.getElementById('sideDrawer');
            const overlay = document.getElementById('drawerOverlay');
            const menuBtn = document.getElementById('menuBtn');

            const isOpen = drawer.classList.toggle('active');
            overlay.classList.toggle('active');
            menuBtn.classList.toggle('active', isOpen);
        }

        function selectTool(radio) {
            currentTool = radio.value;
            const c = toolConfig[currentTool];

            document.getElementById('boxTitle').innerText = c.title;

            const input = document.getElementById('targetInput');
            input.placeholder = c.placeholder;
            input.value = '';

            document.getElementById('statusCount').innerText = 'Ожидание ввода';
            document.getElementById('statusCode').innerText = 'STANDBY';
            document.getElementById('resultsViewport').innerHTML = `
                <div class="blank-text">— Введите цель выше для запуска анализа —</div>
            `;

            setTimeout(toggleMenu, 180);
            input.focus();
        }

        function copyData(val) {
            navigator.clipboard.writeText(val);
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1600);
        }

        document.getElementById('targetInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') runInvestigation();
        });

        async function runInvestigation() {
            const query = document.getElementById('targetInput').value.trim();
            if (!query) return;

            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const resultsViewport = document.getElementById('resultsViewport');
            const statusCount = document.getElementById('statusCount');
            const statusCode = document.getElementById('statusCode');

            btnText.style.display = 'none';
            spinner.style.display = 'block';
            statusCode.innerText = 'PROCESSING...';

            try {
                let html = '';

                if (currentTool === 'subdomains') {
                    const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const res = await fetch(`https://crt.sh/?q=%25.${encodeURIComponent(cleanDomain)}&output=json`);
                    const data = await res.json();
                    const subSet = new Set();

                    data.slice(0, 36).forEach(item => {
                        item.name_value.split('\n').forEach(s => {
                            s = s.trim().toLowerCase();
                            if (!s.includes('*') && s.endsWith(cleanDomain)) subSet.add(s);
                        });
                    });

                    const list = Array.from(subSet);
                    if (list.length > 0) {
                        statusCount.innerText = `НАЙДЕНО: ${list.length} ПОДДОМЕНОВ`;
                        statusCode.innerText = 'COMPLETE';

                        html += '<div class="deck-grid">';
                        for (const sub of list) {
                            html += `
                                <div class="deck-card" onclick="copyData('${sub}')" style="cursor: pointer;">
                                    <span style="font-family: var(--font-mono); font-size: 12px;">${sub}</span>
                                    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                        <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                                        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
                                    </svg>
                                </div>
                            `;
                        }
                        html += '</div>';
                    } else {
                        html = '<div class="blank-text">В открытых реестрах записей не обнаружено</div>';
                        statusCount.innerText = '0 СОВПАДЕНИЙ';
                        statusCode.innerText = 'EMPTY';
                    }
                }
                else if (currentTool === 'username') {
                    const u = query.replace('@', '');
                    const platforms = [
                        { name: "GitHub", url: `https://github.com/${u}` },
                        { name: "Telegram", url: `https://t.me/${u}` },
                        { name: "Reddit", url: `https://reddit.com/user/${u}` },
                        { name: "Steam", url: `https://steamcommunity.com/id/${u}` },
                        { name: "Twitch", url: `https://twitch.tv/${u}` },
                        { name: "Pinterest", url: `https://pinterest.com/${u}/` },
                        { name: "TikTok", url: `https://tiktok.com/@${u}` },
                        { name: "Spotify", url: `https://open.spotify.com/user/${u}` },
                        { name: "GitLab", url: `https://gitlab.com/${u}` },
                        { name: "Chess.com", url: `https://chess.com/member/${u}` },
                        { name: "Medium", url: `https://medium.com/@${u}` },
                        { name: "SoundCloud", url: `https://soundcloud.com/${u}` }
                    ];

                    statusCount.innerText = `ПЛАТФОРМ: ${platforms.length}`;
                    statusCode.innerText = 'COMPLETE';

                    html += '<div class="deck-grid">';
                    for (const p of platforms) {
                        html += `
                            <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="deck-card">
                                <span>${p.name}</span>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="7" y1="17" x2="17" y2="7"></line>
                                    <polyline points="7 7 17 7 17 17"></polyline>
                                </svg>
                            </a>
                        `;
                    }
                    html += '</div>';
                }
                else if (currentTool === 'dns') {
                    const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const types = ['A', 'AAAA', 'MX', 'TXT', 'NS'];
                    let found = 0;
                    let rows = '';

                    for (const t of types) {
                        try {
                            const res = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(cleanDomain)}&type=${t}`, {
                                headers: { 'Accept': 'application/dns-json' }
                            });
                            const data = await res.json();
                            if (data.Answer && data.Answer.length > 0) {
                                found++;
                                const valStr = data.Answer.map(a => a.data).join(', ');
                                rows += `
                                    <div class="table-row">
                                        <span class="table-key">${t}</span>
                                        <div class="table-val-wrap">
                                            <span class="table-val">${valStr}</span>
                                            <button class="copy-btn" title="Копировать" onclick="copyData('${valStr.replace(/'/g, "\\'")}')">
                                                <svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                                            </button>
                                        </div>
                                    </div>
                                `;
                            }
                        } catch (e) {}
                    }

                    if (found > 0) {
                        html = `<div class="table-box">${rows}</div>`;
                        statusCount.innerText = `ДОМЕН: ${cleanDomain}`;
                        statusCode.innerText = 'RESOLVED';
                    } else {
                        html = '<div class="blank-text">Записи DNS не обнаружены</div>';
                        statusCount.innerText = '0 СОВПАДЕНИЙ';
                        statusCode.innerText = 'EMPTY';
                    }
                }
                else if (currentTool === 'ip') {
                    const cleanTarget = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const res = await fetch(`https://freeipapi.com/api/json/${encodeURIComponent(cleanTarget)}`);
                    const data = await res.json();

                    statusCount.innerText = `IP: ${cleanTarget}`;
                    statusCode.innerText = 'RESOLVED';

                    const rows = [
                        ['IP Хоста', data.ipAddress || cleanTarget],
                        ['Локация', `${data.countryName || '—'}, ${data.cityName || '—'}`],
                        ['Индекс зоны', data.zipCode || '—'],
                        ['Таймзона', data.timeZone || '—'],
                        ['Версия IP', data.ipVersion ? `IPv${data.ipVersion}` : '—']
                    ];

                    html += '<div class="table-box">';
                    rows.forEach(([k, v]) => {
                        html += `
                            <div class="table-row">
                                <span class="table-key">${k}</span>
                                <div class="table-val-wrap">
                                    <span class="table-val">${v}</span>
                                    <button class="copy-btn" onclick="copyData('${v}')">
                                        <svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }
                else if (currentTool === 'email') {
                    const cleanEmail = query.trim().toLowerCase();
                    const domain = cleanEmail.split('@')[1] || '—';
                    const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail);

                    statusCount.innerText = cleanEmail;
                    statusCode.innerText = 'PARSED';

                    const rows = [
                        ['Целевой адрес', cleanEmail],
                        ['Доменная зона', domain],
                        ['Формат RFC 5322', isValid ? 'ВАЛИДЕН' : 'ОШИБКА ФОРМАТА']
                    ];

                    html += '<div class="table-box">';
                    rows.forEach(([k, v]) => {
                        html += `
                            <div class="table-row">
                                <span class="table-key">${k}</span>
                                <div class="table-val-wrap">
                                    <span class="table-val">${v}</span>
                                    <button class="copy-btn" onclick="copyData('${v}')">
                                        <svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                resultsViewport.innerHTML = html;
            } catch (e) {
                statusCode.innerText = 'FAILURE';
                resultsViewport.innerHTML = '<div class="blank-text">Сетевая ошибка или блок шлюза API</div>';
            } finally {
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
