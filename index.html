<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherlock Cyber Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
            --cyan: #38bdf8;
            --emerald: #34d399;
            --amber: #fbbf24;
            --red: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #04060a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 24px 130px;
            position: relative;
            overflow-x: hidden;
        }

        /* 📡 РАДАРНЫЙ ФОН */
        #radarCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.35;
        }

        /* 🔝 ВЕРХНИЙ БАР */
        .top-navbar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 28px;
            z-index: 10;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.03));
            border: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        .brand-icon svg {
            width: 18px;
            height: 18px;
            stroke: var(--cyan);
        }

        .brand-name {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .system-telemetry {
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
            background: rgba(52, 211, 153, 0.12);
            border: 1px solid rgba(52, 211, 153, 0.35);
            padding: 5px 12px;
            border-radius: 99rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--emerald);
            box-shadow: 0 0 8px var(--emerald);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* 💻 ШИРОКИЙ ДВУХКОЛОНОЧНЫЙ DASHBOARD */
        .dashboard-grid {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 410px 1fr;
            gap: 24px;
            align-items: start;
            z-index: 10;
        }

        /* 🍏 GLASS ПАНЕЛИ */
        .glass-panel {
            position: relative;
            border-radius: 26px;
            background: 
                linear-gradient(150deg, rgba(13, 18, 28, 0.78) 0%, rgba(6, 9, 15, 0.92) 100%) padding-box,
                linear-gradient(135deg, 
                    rgba(255, 255, 255, 0.75) 0%, 
                    rgba(56, 189, 248, 0.35) 25%, 
                    rgba(255, 255, 255, 0.02) 60%, 
                    rgba(255, 255, 255, 0.3) 100%) border-box;
            border: 1px solid transparent;
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.95),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.4),
                inset 0 -1px 1px 0 rgba(255, 255, 255, 0.08);
            padding: 32px 28px;
        }

        .view-tag {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            color: var(--cyan);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .view-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .view-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .search-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .glass-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            padding: 16px 18px;
            font-family: var(--font-mono);
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .glass-input:focus {
            border-color: var(--cyan);
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
        }

        .glass-input::placeholder {
            font-family: var(--font-main);
            color: rgba(255, 255, 255, 0.25);
        }

        .search-btn {
            background: #ffffff;
            color: #07090e;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s var(--ease-spring);
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .search-btn:hover {
            transform: scale(1.015);
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.4);
        }

        .search-btn:active {
            transform: scale(0.98);
        }

        /* 📋 ПРАВАЯ ПАНЕЛЬ: РЕЗУЛЬТАТЫ */
        .results-panel {
            min-height: 420px;
            display: flex;
            flex-direction: column;
        }

        .results-header {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .terminal-log {
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 16px;
            display: none;
        }

        .log-success { color: var(--emerald); }
        .log-info { color: var(--cyan); }
        .log-warn { color: var(--amber); }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 12px;
        }

        .card-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: 
                linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.5)) padding-box,
                linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.02)) border-box;
            border: 1px solid transparent;
            border-radius: 14px;
            padding: 14px 16px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.2s var(--ease-spring);
        }

        .card-link:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--cyan);
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.2);
        }

        .card-name {
            font-size: 14px;
            font-weight: 600;
        }

        .card-action {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--cyan);
        }

        .data-table {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 13px 16px;
        }

        .data-k {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.45);
        }

        .data-v {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            max-width: 65%;
            text-align: right;
            word-break: break-all;
        }

        .placeholder-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            text-align: center;
            gap: 12px;
            min-height: 240px;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #07090e;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 🪟 ПЛАВАЮЩИЙ GLASS DOCK */
        .menu {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 540px;
            backdrop-filter: blur(18px) saturate(180%) contrast(140%);
            -webkit-backdrop-filter: blur(18px) saturate(180%) contrast(140%);
            background: rgba(10, 14, 22, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.8),
                inset 0 1px 1px rgba(255, 255, 255, 0.4),
                inset 0 -1px 1px rgba(255, 255, 255, 0.1);
            padding: 6px;
            border-radius: 99rem;
            display: flex;
            justify-content: center;
            gap: 6px;
            z-index: 100;
        }

        .menu a {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1 1 0;
            min-width: 0;
            color: rgba(255, 255, 255, 0.45);
            text-decoration: none;
            padding: 10px 4px;
            border-radius: 999rem;
            cursor: pointer;
            transition: all 0.18s var(--ease-spring);
        }

        .menu a:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.08);
        }

        .menu a svg {
            width: 1.3rem;
            height: 1.3rem;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .menu a span {
            font-size: 0.72rem;
            font-weight: 600;
            line-height: 1;
            margin-top: 5px;
        }

        .menu a.active {
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.5),
                0 4px 14px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 860px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            body { padding: 16px 16px 120px; }
            .glass-panel { padding: 24px 20px; }
            .system-telemetry { display: none; }
        }
    </style>
</head>
<body>

    <!-- 📡 Live Radar Canvas -->
    <canvas id="radarCanvas"></canvas>

    <!-- 🔝 ХЕДЕР С ТЕЛЕМЕТРИЕЙ -->
    <header class="top-navbar">
        <div class="brand-header">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
            <span class="brand-name">Sherlock</span>
        </div>
        <div class="system-telemetry">
            <span>SOCKETS // ASYNC</span>
            <span>DNS // CLOUDFLARE_DOH</span>
            <div class="status-badge">
                <span class="status-dot"></span>
                <span>Active Nodes</span>
            </div>
        </div>
    </header>

    <!-- 💻 ШИРОКИЙ ДВУХКОЛОНОЧНЫЙ ТЕРМИНАЛ -->
    <main class="dashboard-grid">
        <!-- ЛЕВАЯ КОЛОНКА -->
        <section class="glass-panel">
            <div class="view-tag" id="viewTag">TARGET PROFILER</div>
            <h1 class="view-title" id="viewTitle">Поиск по никнейму</h1>
            <p class="view-desc" id="viewDesc">Мгновенный опрос открытых платформ и сопоставление цифрового следа</p>

            <div class="search-group">
                <input type="text" id="targetInput" class="glass-input" placeholder="Введите логин (durov, alex)..." autocomplete="off" spellcheck="false">
                <button class="search-btn" id="searchBtn" onclick="runSearch()">
                    <span id="btnText">Запустить сканирование</span>
                    <div class="spinner" id="spinner"></div>
                </button>
            </div>
        </section>

        <!-- ПРАВАЯ КОЛОНКА (МОНИТОР) -->
        <section class="glass-panel results-panel">
            <div class="results-header">
                <span>Монитор данных</span>
                <span id="scanStatus" style="font-family: var(--font-mono); font-size: 11px; color: var(--cyan);">ОЖИДАНИЕ ЦЕЛИ</span>
            </div>
            <div id="terminalLog" class="terminal-log"></div>
            <div id="resultsContent">
                <div class="placeholder-state">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    <span>Задайте цель слева для запуска глубокого сетевого анализа</span>
                </div>
            </div>
        </section>
    </main>

    <!-- 🪟 ПЛАВАЮЩИЙ GLASS DOCK (SVG) -->
    <nav class="menu">
        <a class="active" onclick="switchTool(this, 'username', 'TARGET PROFILER', 'Поиск по никнейму', 'Мгновенный опрос открытых платформ и сопоставление цифрового следа', 'Введите никнейм (durov, alex)...')">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Логин</span>
        </a>
        <a onclick="switchTool(this, 'dns', 'DNS TOPOLOGY', 'DNS и сеть домена', 'Прямой опрос Cloudflare DoH (A, AAAA, MX, TXT, NS)', 'Введите домен (google.com)...')">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            <span>DNS</span>
        </a>
        <a onclick="switchTool(this, 'subdomains', 'CERTIFICATE OSINT', 'Поиск поддоменов', 'Парсинг логов прозрачности SSL-сертификатов (crt.sh)', 'Домен для поиска (tesla.com)...')">
            <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            <span>Субдомены</span>
        </a>
        <a onclick="switchTool(this, 'ip', 'GEOINT & BGP', 'Геолокация IP', 'Определение ASN, провайдера, страны, города и координат', 'IP адрес или хост (1.1.1.1)...')">
            <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <span>IP-инфо</span>
        </a>
        <a onclick="switchTool(this, 'email', 'MAIL FOOTPRINT', 'Анализ почты', 'Проверка синтаксиса, MX-шлюза и профиля Gravatar', 'Email адрес (target@mail.com)...')">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <span>Email</span>
        </a>
    </nav>

    <script>
        // 📡 Радарная анимация
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        let angle = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawRadar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const r = Math.min(canvas.width, canvas.height) * 0.45;

            ctx.strokeStyle = 'rgba(56, 189, 248, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 1; i <= 4; i++) {
                ctx.beginPath();
                ctx.arc(cx, cy, (r / 4) * i, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);
            const grad = ctx.createLinearGradient(0, 0, r, 0);
            grad.addColorStop(0, 'rgba(56, 189, 248, 0.15)');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, r, 0, Math.PI / 3);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            angle += 0.015;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();

        // 🎛 Логика переключения инструментов
        let currentTool = 'username';

        function switchTool(btn, tool, tag, title, desc, placeholder) {
            document.querySelectorAll('.menu a').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            currentTool = tool;

            document.getElementById('viewTag').innerText = tag;
            document.getElementById('viewTitle').innerText = title;
            document.getElementById('viewDesc').innerText = desc;
            const input = document.getElementById('targetInput');
            input.placeholder = placeholder;
            input.value = '';
            document.getElementById('terminalLog').style.display = 'none';
            document.getElementById('resultsContent').innerHTML = `
                <div class="placeholder-state">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    <span>Задайте цель слева для запуска глубокого сетевого анализа</span>
                </div>
            `;
            document.getElementById('scanStatus').innerText = 'ОЖИДАНИЕ ЦЕЛИ';
            input.focus();
        }

        document.getElementById('targetInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') runSearch();
        });

        // 🧠 Автономные браузерные OSINT-движки
        async function runSearch() {
            const query = document.getElementById('targetInput').value.trim();
            if (!query) return;

            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const resultsContent = document.getElementById('resultsContent');
            const scanStatus = document.getElementById('scanStatus');
            const terminalLog = document.getElementById('terminalLog');

            btnText.style.display = 'none';
            spinner.style.display = 'block';
            scanStatus.innerText = 'СКАНИРОВАНИЕ...';
            terminalLog.style.display = 'block';
            terminalLog.innerHTML = `<span class="log-info">[+] Инициализация целевого объекта: ${query}</span><br>`;

            try {
                let html = '';

                // 1. Поиск по логину
                if (currentTool === 'username') {
                    const u = query.replace('@', '');
                    terminalLog.innerHTML += `<span class="log-info">[+] Опрос открытых платформ по идентификатору...</span><br>`;
                    
                    const platforms = [
                        { name: "GitHub", url: `https://github.com/${u}` },
                        { name: "Telegram", url: `https://t.me/${u}` },
                        { name: "Reddit", url: `https://reddit.com/user/${u}` },
                        { name: "Steam", url: `https://steamcommunity.com/id/${u}` },
                        { name: "Twitch", url: `https://twitch.tv/${u}` },
                        { name: "Pinterest", url: `https://pinterest.com/${u}/` },
                        { name: "TikTok", url: `https://tiktok.com/@${u}` },
                        { name: "Spotify", url: `https://open.spotify.com/user/${u}` },
                        { name: "GitLab", url: `https://gitlab.com/${u}` },
                        { name: "Chess.com", url: `https://chess.com/member/${u}` },
                        { name: "Medium", url: `https://medium.com/@${u}` },
                        { name: "SoundCloud", url: `https://soundcloud.com/${u}` }
                    ];

                    terminalLog.innerHTML += `<span class="log-success">[✓] Сформирована матрица из ${platforms.length} профилей</span><br>`;
                    scanStatus.innerText = `НАЙДЕНО: ${platforms.length}`;

                    html += '<div class="results-grid">';
                    for (const p of platforms) {
                        html += `
                            <a href="${p.url}" target="_blank" class="card-link">
                                <span class="card-name">${p.name}</span>
                                <span class="card-action">ОТКРЫТЬ ↗</span>
                            </a>
                        `;
                    }
                    html += '</div>';
                }

                // 2. DNS
                else if (currentTool === 'dns') {
                    const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    terminalLog.innerHTML += `<span class="log-info">[+] Запрос DNS-записей через Cloudflare DoH...</span><br>`;
                    const types = ['A', 'AAAA', 'MX', 'TXT', 'NS'];
                    html += '<div class="data-table">';

                    for (const t of types) {
                        try {
                            const res = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(cleanDomain)}&type=${t}`, {
                                headers: { 'Accept': 'application/dns-json' }
                            });
                            const data = await res.json();
                            if (data.Answer && data.Answer.length > 0) {
                                const vals = data.Answer.map(a => a.data).join(', ');
                                html += `
                                    <div class="data-row">
                                        <span class="data-k">${t} RECORD</span>
                                        <span class="data-v">${vals}</span>
                                    </div>
                                `;
                            }
                        } catch (e) {}
                    }
                    html += '</div>';
                    terminalLog.innerHTML += `<span class="log-success">[✓] Топология домена успешно определена</span><br>`;
                    scanStatus.innerText = 'УСПЕШНО';
                }

                // 3. Поддомены crt.sh
                else if (currentTool === 'subdomains') {
                    const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    terminalLog.innerHTML += `<span class="log-info">[+] Парсинг глобальных логов SSL (crt.sh)...</span><br>`;
                    const res = await fetch(`https://crt.sh/?q=%25.${encodeURIComponent(cleanDomain)}&output=json`);
                    const data = await res.json();
                    const subs = new Set();

                    data.slice(0, 40).forEach(item => {
                        item.name_value.split('\n').forEach(s => {
                            s = s.trim().toLowerCase();
                            if (!s.includes('*') && s.endsWith(cleanDomain)) subs.add(s);
                        });
                    });

                    const list = Array.from(subs);
                    if (list.length > 0) {
                        terminalLog.innerHTML += `<span class="log-success">[✓] Обнаружено уникальных субдоменов: ${list.length}</span><br>`;
                        scanStatus.innerText = `НАЙДЕНО: ${list.length}`;
                        html += '<div class="results-grid">';
                        for (const s of list) {
                            html += `
                                <div class="card-link" style="cursor: default;">
                                    <span class="card-name" style="font-family: var(--font-mono); font-size: 13px;">${s}</span>
                                </div>
                            `;
                        }
                        html += '</div>';
                    } else {
                        terminalLog.innerHTML += `<span class="log-warn">[!] Открытых записей сертификатов не обнаружено</span><br>`;
                        scanStatus.innerText = '0 СОВПАДЕНИЙ';
                        html = '<div class="placeholder-state"><span>Поддоменов не найдено.</span></div>';
                    }
                }

                // 4. IP Geointel
                else if (currentTool === 'ip') {
                    const cleanTarget = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    terminalLog.innerHTML += `<span class="log-info">[+] Опрос спутникового гео-шлюза FreeIPAPI...</span><br>`;
                    const res = await fetch(`https://freeipapi.com/api/json/${encodeURIComponent(cleanTarget)}`);
                    const data = await res.json();

                    terminalLog.innerHTML += `<span class="log-success">[✓] Координаты и провайдер зафиксированы</span><br>`;
                    scanStatus.innerText = 'УСПЕШНО';
                    html += `
                        <div class="data-table">
                            <div class="data-row"><span class="data-k">IP ADDRESS</span><span class="data-v">${data.ipAddress || cleanTarget}</span></div>
                            <div class="data-row"><span class="data-k">COUNTRY</span><span class="data-v">${data.countryName || '—'}</span></div>
                            <div class="data-row"><span class="data-k">CITY</span><span class="data-v">${data.cityName || '—'}</span></div>
                            <div class="data-row"><span class="data-k">ZIP CODE</span><span class="data-v">${data.zipCode || '—'}</span></div>
                            <div class="data-row"><span class="data-k">PROTOCOL</span><span class="data-v">${data.ipVersion ? 'IPv' + data.ipVersion : '—'}</span></div>
                        </div>
                    `;
                }

                // 5. Email
                else if (currentTool === 'email') {
                    const cleanEmail = query.trim().toLowerCase();
                    const domain = cleanEmail.split('@')[1] || 'Не указан';
                    terminalLog.innerHTML += `<span class="log-info">[+] Анализ почтового шлюза и домена ${domain}...</span><br>`;
                    terminalLog.innerHTML += `<span class="log-success">[✓] Синтаксический анализ завершен</span><br>`;
                    scanStatus.innerText = 'УСПЕШНО';
                    html += `
                        <div class="data-table">
                            <div class="data-row"><span class="data-k">EMAIL</span><span class="data-v">${cleanEmail}</span></div>
                            <div class="data-row"><span class="data-k">MAIL DOMAIN</span><span class="data-v">${domain}</span></div>
                            <div class="data-row"><span class="data-k">FORMAT STATUS</span><span class="data-v">${cleanEmail.includes('@') ? 'Корректный' : 'Ошибка формата'}</span></div>
                        </div>
                    `;
                }

                resultsContent.innerHTML = html;
            } catch (e) {
                terminalLog.innerHTML += `<span class="log-warn">[!] Ошибка при обращении к целевому шлюзу</span><br>`;
                scanStatus.innerText = 'ОШИБКА';
                resultsContent.innerHTML = '<div class="placeholder-state"><span>Не удалось получить ответ от открытых серверов. Проверьте интернет.</span></div>';
            } finally {
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
