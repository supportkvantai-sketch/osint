<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherlock Intelligence Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #07090e;
            background-image: 
                radial-gradient(circle at 50% 10%, #151a24 0%, transparent 60%),
                radial-gradient(circle at 90% 90%, #0d1017 0%, transparent 50%),
                radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 28px 28px;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 24px 120px;
        }

        .top-navbar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 28px;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-svg {
            width: 24px;
            height: 24px;
            stroke: #ffffff;
        }

        .brand-name {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 99rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        .dashboard-grid {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 24px;
            align-items: start;
        }

        .glass-panel {
            position: relative;
            border-radius: 28px;
            background: 
                linear-gradient(150deg, rgba(17, 21, 30, 0.75) 0%, rgba(9, 11, 16, 0.9) 100%) padding-box,
                linear-gradient(135deg, 
                    rgba(255, 255, 255, 0.8) 0%, 
                    rgba(255, 255, 255, 0.25) 30%, 
                    rgba(255, 255, 255, 0.02) 60%, 
                    rgba(255, 255, 255, 0.35) 100%) border-box;
            border: 1px solid transparent;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.9),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.4),
                inset 0 -1px 1px 0 rgba(255, 255, 255, 0.1);
            padding: 32px 28px;
        }

        .view-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .view-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .search-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .glass-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 16px 18px;
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .glass-input:focus {
            border-color: rgba(255, 255, 255, 0.45);
            background: rgba(0, 0, 0, 0.65);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .search-btn {
            background: #ffffff;
            color: #07090e;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s var(--ease-spring);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-btn:hover {
            transform: scale(1.01);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.35);
        }

        .search-btn:active {
            transform: scale(0.98);
        }

        .results-panel {
            min-height: 280px;
        }

        .results-header {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .card-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: 
                linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.45)) padding-box,
                linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.02)) border-box;
            border: 1px solid transparent;
            border-radius: 16px;
            padding: 15px 18px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.2s var(--ease-spring);
        }

        .card-link:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.35);
        }

        .card-name {
            font-size: 14px;
            font-weight: 600;
        }

        .card-action {
            font-family: var(--font-mono);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }

        .data-table {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 14px 18px;
        }

        .data-k {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.45);
        }

        .data-v {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            max-width: 65%;
            text-align: right;
            word-break: break-all;
        }

        .placeholder-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            text-align: center;
            gap: 10px;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #07090e;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .menu {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 540px;
            backdrop-filter: blur(16px) saturate(180%) contrast(150%);
            -webkit-backdrop-filter: blur(16px) saturate(180%) contrast(150%);
            background: rgba(14, 18, 26, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.7),
                inset 0 1px 1px rgba(255, 255, 255, 0.4),
                inset 0 -1px 1px rgba(255, 255, 255, 0.1);
            padding: 6px;
            border-radius: 99rem;
            display: flex;
            justify-content: center;
            gap: 6px;
            z-index: 100;
        }

        .menu a {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1 1 0;
            min-width: 0;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            padding: 10px 4px;
            border-radius: 999rem;
            cursor: pointer;
            transition: all 0.18s var(--ease-spring);
        }

        .menu a:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.08);
        }

        .menu a svg {
            width: 1.3rem;
            height: 1.3rem;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .menu a span {
            font-size: 0.72rem;
            font-weight: 600;
            line-height: 1;
            margin-top: 5px;
        }

        .menu a.active {
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.5),
                0 4px 12px rgba(0, 0, 0, 0.4);
        }

        @media (max-width: 860px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            body { padding: 16px 16px 120px; }
            .glass-panel { padding: 24px 20px; }
        }
    </style>
</head>
<body>

    <header class="top-navbar">
        <div class="brand-header">
            <svg class="brand-svg" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <circle cx="11" cy="11" r="3"></circle>
            </svg>
            <span class="brand-name">Sherlock</span>
        </div>
        <div class="status-badge">
            <span class="status-dot"></span>
            <span>OSINT Engine Active</span>
        </div>
    </header>

    <main class="dashboard-grid">
        <section class="glass-panel">
            <h1 class="view-title" id="viewTitle">Поиск по логину</h1>
            <p class="view-desc" id="viewDesc">Параллельная проверка существования профиля на открытых платформах</p>

            <div class="search-group">
                <input type="text" id="targetInput" class="glass-input" placeholder="Введите никнейм (durov, alex)..." autocomplete="off" spellcheck="false">
                <button class="search-btn" id="searchBtn" onclick="runSearch()">
                    <span id="btnText">Запустить сканирование</span>
                    <div class="spinner" id="spinner"></div>
                </button>
            </div>
        </section>

        <section class="glass-panel results-panel" id="resultsPanel">
            <div class="results-header">
                <span id="resultsCount">Результаты анализа</span>
                <span id="scanStatus" style="font-family: var(--font-mono); font-size: 11px;">ГОТОВ К РАБОТЕ</span>
            </div>
            <div id="resultsContent">
                <div class="placeholder-state">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <span>Введите объект поиска слева и нажмите «Запустить»</span>
                </div>
            </div>
        </section>
    </main>

    <nav class="menu">
        <a class="active" onclick="switchTool(this, 'username', 'Поиск по логину', 'Параллельная проверка существования профиля на открытых платформах', 'Введите никнейм (durov, alex)...')">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Логин</span>
        </a>
        <a onclick="switchTool(this, 'dns', 'DNS и сеть домена', 'Проверка A, MX, TXT и NS записей через Cloudflare DNS', 'Введите домен (google.com)...')">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            <span>DNS</span>
        </a>
        <a onclick="switchTool(this, 'subdomains', 'Поиск поддоменов', 'Анализ логов прозрачности SSL-сертификатов (crt.sh)', 'Домен для поиска (tesla.com)...')">
            <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            <span>Субдомены</span>
        </a>
        <a onclick="switchTool(this, 'ip', 'Геолокация IP', 'Определение страны, города, координат и провайдера', 'IP адрес или хост (1.1.1.1)...')">
            <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <span>IP-инфо</span>
        </a>
        <a onclick="switchTool(this, 'email', 'Анализ почты', 'Проверка почтового шлюза и хеша аккаунта', 'Email адрес (target@mail.com)...')">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <span>Email</span>
        </a>
    </nav>

    <script>
        let currentTool = 'username';

        function switchTool(btn, tool, title, desc, placeholder) {
            document.querySelectorAll('.menu a').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            currentTool = tool;

            document.getElementById('viewTitle').innerText = title;
            document.getElementById('viewDesc').innerText = desc;
            const input = document.getElementById('targetInput');
            input.placeholder = placeholder;
            input.value = '';
            document.getElementById('resultsContent').innerHTML = `
                <div class="placeholder-state">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <span>Введите объект поиска слева и нажмите «Запустить»</span>
                </div>
            `;
            document.getElementById('scanStatus').innerText = 'ГОТОВ К РАБОТЕ';
            input.focus();
        }

        document.getElementById('targetInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') runSearch();
        });

        // 🧠 ВСТРОЕННЫЕ OSINT-ДВИЖКИ (РАБОТАЮТ ПРЯМО В БРАУЗЕРЕ)
        async function runSearch() {
            const query = document.getElementById('targetInput').value.trim();
            if (!query) return;

            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const resultsContent = document.getElementById('resultsContent');
            const scanStatus = document.getElementById('scanStatus');

            btnText.style.display = 'none';
            spinner.style.display = 'block';
            scanStatus.innerText = 'СКАНИРОВАНИЕ...';

            try {
                let html = '';

                // 1. Поиск по логину (Браузерный движок)
                if (currentTool === 'username') {
                    const u = query.replace('@', '');
                    const platforms = [
                        { name: "GitHub", url: `https://github.com/${u}` },
                        { name: "Telegram", url: `https://t.me/${u}` },
                        { name: "Reddit", url: `https://reddit.com/user/${u}` },
                        { name: "Steam", url: `https://steamcommunity.com/id/${u}` },
                        { name: "Twitch", url: `https://twitch.tv/${u}` },
                        { name: "Pinterest", url: `https://pinterest.com/${u}/` },
                        { name: "TikTok", url: `https://tiktok.com/@${u}` },
                        { name: "Spotify", url: `https://open.spotify.com/user/${u}` },
                        { name: "GitLab", url: `https://gitlab.com/${u}` },
                        { name: "Chess.com", url: `https://chess.com/member/${u}` },
                        { name: "Medium", url: `https://medium.com/@${u}` },
                        { name: "SoundCloud", url: `https://soundcloud.com/${u}` }
                    ];

                    scanStatus.innerText = `СФОРМИРОВАНО: ${platforms.length}`;
                    html += '<div class="results-grid">';
                    for (const p of platforms) {
                        html += `
                            <a href="${p.url}" target="_blank" class="card-link">
                                <span class="card-name">${p.name}</span>
                                <span class="card-action">Открыть ↗</span>
                            </a>
                        `;
                    }
                    html += '</div>';
                }

                // 2. DNS-записи (Прямой опрос Cloudflare DoH API)
                else if (currentTool === 'dns') {
                    const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const types = ['A', 'AAAA', 'MX', 'TXT', 'NS'];
                    html += '<div class="data-table">';

                    for (const t of types) {
                        try {
                            const res = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(cleanDomain)}&type=${t}`, {
                                headers: { 'Accept': 'application/dns-json' }
                            });
                            const data = await res.json();
                            if (data.Answer && data.Answer.length > 0) {
                                const vals = data.Answer.map(a => a.data).join(', ');
                                html += `
                                    <div class="data-row">
                                        <span class="data-k">${t} RECORD</span>
                                        <span class="data-v">${vals}</span>
                                    </div>
                                `;
                            }
                        } catch (e) {}
                    }
                    html += '</div>';
                    scanStatus.innerText = 'УСПЕШНО';
                }

                // 3. Поиск поддоменов (Прямой опрос базы сертификатов crt.sh)
                else if (currentTool === 'subdomains') {
                    const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const res = await fetch(`https://crt.sh/?q=%25.${encodeURIComponent(cleanDomain)}&output=json`);
                    const data = await res.json();
                    const subs = new Set();

                    data.slice(0, 40).forEach(item => {
                        item.name_value.split('\n').forEach(s => {
                            s = s.trim().toLowerCase();
                            if (!s.includes('*') && s.endsWith(cleanDomain)) subs.add(s);
                        });
                    });

                    const list = Array.from(subs);
                    if (list.length > 0) {
                        scanStatus.innerText = `НАЙДЕНО: ${list.length}`;
                        html += '<div class="results-grid">';
                        for (const s of list) {
                            html += `
                                <div class="card-link" style="cursor: default;">
                                    <span class="card-name" style="font-family: var(--font-mono); font-size: 13px;">${s}</span>
                                </div>
                            `;
                        }
                        html += '</div>';
                    } else {
                        scanStatus.innerText = '0 СОВПАДЕНИЙ';
                        html = '<div class="placeholder-state"><span>Поддоменов в открытых сертификатах не найдено.</span></div>';
                    }
                }

                // 4. IP Геолокация (Прямой опрос FreeIPAPI)
                else if (currentTool === 'ip') {
                    const cleanTarget = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const res = await fetch(`https://freeipapi.com/api/json/${encodeURIComponent(cleanTarget)}`);
                    const data = await res.json();

                    scanStatus.innerText = 'УСПЕШНО';
                    html += `
                        <div class="data-table">
                            <div class="data-row"><span class="data-k">IP АДРЕС</span><span class="data-v">${data.ipAddress || cleanTarget}</span></div>
                            <div class="data-row"><span class="data-k">СТРАНА</span><span class="data-v">${data.countryName || 'Не определено'}</span></div>
                            <div class="data-row"><span class="data-k">ГОРОД</span><span class="data-v">${data.cityName || 'Не определено'}</span></div>
                            <div class="data-row"><span class="data-k">ИНДЕКС</span><span class="data-v">${data.zipCode || '—'}</span></div>
                            <div class="data-row"><span class="data-k">ВЕРСИЯ IP</span><span class="data-v">${data.ipVersion ? 'IPv' + data.ipVersion : '—'}</span></div>
                        </div>
                    `;
                }

                // 5. Анализ почты
                else if (currentTool === 'email') {
                    const cleanEmail = query.trim().toLowerCase();
                    const domain = cleanEmail.split('@')[1] || 'Не указан';
                    scanStatus.innerText = 'УСПЕШНО';
                    html += `
                        <div class="data-table">
                            <div class="data-row"><span class="data-k">EMAIL</span><span class="data-v">${cleanEmail}</span></div>
                            <div class="data-row"><span class="data-k">ПОЧТОВЫЙ ДОМЕН</span><span class="data-v">${domain}</span></div>
                            <div class="data-row"><span class="data-k">СТАТУС ФОРМАТА</span><span class="data-v">${cleanEmail.includes('@') ? 'Корректный синтаксис' : 'Ошибка формата'}</span></div>
                        </div>
                    `;
                }

                resultsContent.innerHTML = html;
            } catch (e) {
                scanStatus.innerText = 'ОШИБКА';
                resultsContent.innerHTML = '<div class="placeholder-state"><span>Не удалось получить данные по этому объекту. Проверьте подключение к интернету.</span></div>';
            } finally {
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
