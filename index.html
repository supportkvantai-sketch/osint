<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherlock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --mono: 'JetBrains Mono', monospace;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(255, 255, 255, 0.3);
            --bg: #07080c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 0%, #171d2a 0%, transparent 60%),
                radial-gradient(circle at 90% 100%, #10141f 0%, transparent 50%),
                radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 28px 28px;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* 🔝 ПОЛНОШИРИННЫЙ ВЕРХНИЙ БАР */
        .navbar {
            width: 100%;
            height: 70px;
            border-bottom: 1px solid var(--border);
            background: rgba(10, 12, 18, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 36px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.16);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }

        .brand-icon svg {
            width: 18px;
            height: 18px;
            stroke: #ffffff;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 99rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        /* 🔘 КНОПКА МЕНЮ СПРАВА */
        .menu-toggle-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            height: 40px;
            padding: 0 16px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.2s var(--ease);
            backdrop-filter: blur(12px);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        .menu-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.02);
        }

        .menu-toggle-btn svg {
            width: 18px;
            height: 18px;
            stroke: #ffffff;
        }

        /* 💻 СВОБОДНАЯ РАБОЧАЯ ОБЛАСТЬ (БЕЗ КОРОБОК) */
        .main-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            flex: 1;
            padding: 50px 24px 80px;
            display: flex;
            flex-direction: column;
        }

        .tool-intro {
            margin-bottom: 28px;
        }

        .tool-title {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin-bottom: 8px;
        }

        .tool-desc {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.5;
        }

        /* 🔍 ПОИСКОВАЯ СТРОКА */
        .search-wrapper {
            display: flex;
            align-items: center;
            background: rgba(18, 22, 32, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            padding: 8px 10px 8px 22px;
            margin-bottom: 20px;
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            box-shadow: 
                0 20px 40px -10px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transition: all 0.25s var(--ease);
        }

        .search-wrapper:focus-within {
            border-color: var(--border-focus);
            background: rgba(22, 28, 40, 0.8);
            box-shadow: 
                0 25px 50px -10px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.2),
                inset 0 1px 1px rgba(255, 255, 255, 0.3);
        }

        .search-icon {
            width: 20px;
            height: 20px;
            stroke: rgba(255, 255, 255, 0.4);
            margin-right: 14px;
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            outline: none;
            min-width: 0;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.28);
        }

        .search-btn {
            background: #ffffff;
            color: #06070b;
            border: none;
            border-radius: 14px;
            padding: 13px 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s var(--ease);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        .search-btn:hover {
            background: #f1f5f9;
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.35);
        }

        .search-btn:active {
            transform: scale(0.98);
        }

        .kbd-hint {
            font-family: var(--mono);
            font-size: 11px;
            opacity: 0.5;
        }

        /* ПРЕСЕТЫ */
        .presets-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 36px;
            flex-wrap: wrap;
        }

        .preset-title {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .preset-chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.15s var(--ease);
        }

        .preset-chip:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        /* 📋 РЕЗУЛЬТАТЫ */
        .results-section {
            border-top: 1px solid var(--border);
            padding-top: 28px;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 18px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 12px;
        }

        .card-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 22, 32, 0.5);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 20px;
            text-decoration: none;
            color: #ffffff;
            backdrop-filter: blur(16px);
            transition: all 0.2s var(--ease);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        .card-item:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
        }

        .card-link-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.45);
        }

        .data-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 22, 32, 0.5);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 22px;
            backdrop-filter: blur(16px);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        .data-k {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.45);
        }

        .data-v {
            font-family: var(--mono);
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            max-width: 65%;
            text-align: right;
            word-break: break-all;
        }

        .placeholder-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 220px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            text-align: center;
            gap: 10px;
        }

        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #06070b;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ==========================================
           🪟 ВЫЕЗЖАЮЩЕЕ СПРАВА СТЕКЛЯННОЕ МЕНЮ (DRAWER)
           ========================================== */
        .drawer-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s var(--ease);
            z-index: 90;
        }

        .drawer-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 320px;
            background: rgba(14, 18, 26, 0.85);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(36px) saturate(190%);
            -webkit-backdrop-filter: blur(36px) saturate(190%);
            box-shadow: -20px 0 60px rgba(0, 0, 0, 0.7);
            z-index: 100;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transform: translateX(100%);
            transition: transform 0.35s var(--ease);
        }

        .drawer.active {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .drawer-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: #ffffff;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* 🌟 ЛАЗЕРНЫЙ ГЛАЙДЕР ВНУТРИ ВЫЕЗЖАЮЩЕГО МЕНЮ */
        .radio-container {
            --main-color: #ffffff;
            --main-color-opacity: rgba(255, 255, 255, 0.1);
            --total-radio: 5;

            display: flex;
            flex-direction: column;
            position: relative;
            padding-left: 0.5rem;
            margin-top: 10px;
        }

        .radio-container input {
            cursor: pointer;
            appearance: none;
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .radio-container .glider-container {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background: linear-gradient(
                0deg,
                rgba(0, 0, 0, 0) 0%,
                rgba(255, 255, 255, 0.15) 50%,
                rgba(0, 0, 0, 0) 100%
            );
            width: 2px;
        }

        .radio-container .glider-container .glider {
            position: relative;
            height: calc(100% / var(--total-radio));
            width: 100%;
            background: linear-gradient(
                0deg,
                rgba(0, 0, 0, 0) 0%,
                var(--main-color) 50%,
                rgba(0, 0, 0, 0) 100%
            );
            transition: transform 0.4s var(--ease);
        }

        .radio-container .glider-container .glider::before {
            content: "";
            position: absolute;
            height: 60%;
            width: 400%;
            top: 50%;
            transform: translateY(-50%);
            background: var(--main-color);
            filter: blur(8px);
            opacity: 0.9;
        }

        .radio-container .glider-container .glider::after {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 220px;
            background: linear-gradient(
                90deg,
                var(--main-color-opacity) 0%,
                rgba(0, 0, 0, 0) 100%
            );
            pointer-events: none;
        }

        .radio-container label {
            cursor: pointer;
            padding: 1.1rem 1.4rem;
            position: relative;
            color: rgba(255, 255, 255, 0.45);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.25s ease-in-out;
            user-select: none;
        }

        .radio-container label svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .radio-container input:checked + label {
            color: var(--main-color);
        }

        .radio-container input:checked + label svg {
            stroke: var(--main-color);
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.6));
        }

        .radio-container input:nth-of-type(1):checked ~ .glider-container .glider { transform: translateY(0); }
        .radio-container input:nth-of-type(2):checked ~ .glider-container .glider { transform: translateY(100%); }
        .radio-container input:nth-of-type(3):checked ~ .glider-container .glider { transform: translateY(200%); }
        .radio-container input:nth-of-type(4):checked ~ .glider-container .glider { transform: translateY(300%); }
        .radio-container input:nth-of-type(5):checked ~ .glider-container .glider { transform: translateY(400%); }

        @media (max-width: 768px) {
            .navbar { padding: 0 20px; }
            .status-pill { display: none; }
            .main-container { padding: 30px 16px 60px; }
            .tool-title { font-size: 28px; }
            .drawer { width: 280px; }
        }
    </style>
</head>
<body>

    <!-- 🔝 ВЕРХНИЙ НАВБАР С КНОПКОЙ МЕНЮ СПРАВА -->
    <header class="navbar">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
            <span class="brand-name">Sherlock</span>
        </div>

        <div class="header-actions">
            <div class="status-pill">
                <span class="status-dot"></span>
                <span>Система активна</span>
            </div>

            <!-- Кнопка вызова меню справа -->
            <button class="menu-toggle-btn" onclick="toggleDrawer()">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
                <span>Меню</span>
            </button>
        </div>
    </header>

    <!-- 💻 ПОЛНОРАЗМЕРНАЯ РАБОЧАЯ ЗОНА (БЕЗ КОРОБОК) -->
    <main class="main-container">
        <div class="tool-intro">
            <h1 class="tool-title" id="toolTitle">Поиск по никнейму</h1>
            <p class="tool-desc" id="toolDesc">Параллельная верификация профиля на 15+ открытых платформах в реальном времени</p>
        </div>

        <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="targetInput" class="search-input" placeholder="Введите никнейм (например: durov)..." autocomplete="off" spellcheck="false">
            <button class="search-btn" id="searchBtn" onclick="runSearch()">
                <span id="btnText">Поиск</span>
                <span class="kbd-hint" id="kbdHint">↵</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </div>

        <div class="presets-row" id="presetsRow">
            <span class="preset-title">Примеры:</span>
            <span class="preset-chip" onclick="applyPreset('durov')">durov</span>
            <span class="preset-chip" onclick="applyPreset('alex')">alex</span>
            <span class="preset-chip" onclick="applyPreset('developer')">developer</span>
        </div>

        <div class="results-section">
            <div class="status-header">
                <span id="resultsCount">Результаты анализа</span>
                <span id="scanStatus">Готов к работе</span>
            </div>
            <div id="resultsContent">
                <div class="placeholder-state">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <span>Введите цель поиска выше или откройте меню справа для смены инструмента</span>
                </div>
            </div>
        </div>
    </main>

    <!-- ТЕМНЫЙ ЗАТЕМНИТЕЛЬ ДЛЯ ФОНА -->
    <div class="drawer-backdrop" id="drawerBackdrop" onclick="toggleDrawer()"></div>

    <!-- 🪟 ВЫЕЗЖАЮЩАЯ СПРАВА СТЕКЛЯННАЯ ПАНЕЛЬ С ГЛАЙДЕРОМ -->
    <aside class="drawer" id="drawer">
        <div class="drawer-header">
            <span class="drawer-title">Инструменты разведки</span>
            <button class="close-btn" onclick="toggleDrawer()">✕</button>
        </div>

        <div class="radio-container">
            <input type="radio" id="tab-username" name="osint-tool" value="username" checked onchange="handleTabChange(this)">
            <label for="tab-username">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Логин</span>
            </label>

            <input type="radio" id="tab-dns" name="osint-tool" value="dns" onchange="handleTabChange(this)">
            <label for="tab-dns">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                <span>DNS</span>
            </label>

            <input type="radio" id="tab-subdomains" name="osint-tool" value="subdomains" onchange="handleTabChange(this)">
            <label for="tab-subdomains">
                <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                <span>Субдомены</span>
            </label>

            <input type="radio" id="tab-ip" name="osint-tool" value="ip" onchange="handleTabChange(this)">
            <label for="tab-ip">
                <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                <span>IP-инфо</span>
            </label>

            <input type="radio" id="tab-email" name="osint-tool" value="email" onchange="handleTabChange(this)">
            <label for="tab-email">
                <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                <span>Email</span>
            </label>

            <div class="glider-container">
                <div class="glider"></div>
            </div>
        </div>
    </aside>

    <script>
        let currentTool = 'username';

        const toolData = {
            username: {
                title: 'Поиск по никнейму',
                desc: 'Параллельная верификация профиля на 15+ открытых платформах в реальном времени',
                placeholder: 'Введите никнейм (например: durov)...',
                presets: ['durov', 'alex', 'developer']
            },
            dns: {
                title: 'DNS записи домена',
                desc: 'Получение A, MX, TXT и NS записей через защищенный шлюз Cloudflare DoH',
                placeholder: 'Введите домен (например: google.com)...',
                presets: ['google.com', 'github.com', 'telegram.org']
            },
            subdomains: {
                title: 'Поиск поддоменов',
                desc: 'Парсинг глобальных открытых логов SSL-сертификатов (crt.sh)',
                placeholder: 'Домен для поиска (например: tesla.com)...',
                presets: ['tesla.com', 'spotify.com', 'uber.com']
            },
            ip: {
                title: 'Сведения об IP адресе',
                desc: 'Определение страны, города, ASN-провайдера и сетевой информации хоста',
                placeholder: 'IP адрес или хост (например: 1.1.1.1)...',
                presets: ['1.1.1.1', '8.8.8.8', '9.9.9.9']
            },
            email: {
                title: 'Анализ почты',
                desc: 'Проверка синтаксиса, доменной зоны и существования почтового сервера',
                placeholder: 'Email адрес (например: name@domain.com)...',
                presets: ['contact@gmail.com', 'support@apple.com']
            }
        };

        // Открытие / закрытие выезжающей панели
        function toggleDrawer() {
            document.getElementById('drawer').classList.toggle('active');
            document.getElementById('drawerBackdrop').classList.toggle('active');
        }

        function handleTabChange(radio) {
            currentTool = radio.value;
            const t = toolData[currentTool];

            document.getElementById('toolTitle').innerText = t.title;
            document.getElementById('toolDesc').innerText = t.desc;
            const input = document.getElementById('targetInput');
            input.placeholder = t.placeholder;
            input.value = '';
            document.getElementById('resultsCount').innerText = 'Результаты анализа';
            document.getElementById('scanStatus').innerText = 'Готов к работе';

            let presetsHtml = '<span class="preset-title">Примеры:</span>';
            t.presets.forEach(p => {
                presetsHtml += `<span class="preset-chip" onclick="applyPreset('${p}')">${p}</span>`;
            });
            document.getElementById('presetsRow').innerHTML = presetsHtml;

            document.getElementById('resultsContent').innerHTML = `
                <div class="placeholder-state">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <span>Введите цель поиска выше</span>
                </div>
            `;
            
            // Автоматически закрываем панель после выбора инструмента
            setTimeout(toggleDrawer, 180);
            input.focus();
        }

        function applyPreset(val) {
            document.getElementById('targetInput').value = val;
            runSearch();
        }

        document.getElementById('targetInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') runSearch();
        });

        async function runSearch() {
            const query = document.getElementById('targetInput').value.trim();
            if (!query) return;

            const btnText = document.getElementById('btnText');
            const kbdHint = document.getElementById('kbdHint');
            const spinner = document.getElementById('spinner');
            const resultsContent = document.getElementById('resultsContent');
            const resultsCount = document.getElementById('resultsCount');
            const scanStatus = document.getElementById('scanStatus');

            btnText.style.display = 'none';
            kbdHint.style.display = 'none';
            spinner.style.display = 'block';
            scanStatus.innerText = 'Сканирование...';

            try {
                let html = '';

                if (currentTool === 'username') {
                    const u = query.replace('@', '');
                    const platforms = [
                        { name: "GitHub", url: `https://github.com/${u}` },
                        { name: "Telegram", url: `https://t.me/${u}` },
                        { name: "Reddit", url: `https://reddit.com/user/${u}` },
                        { name: "Steam", url: `https://steamcommunity.com/id/${u}` },
                        { name: "Twitch", url: `https://twitch.tv/${u}` },
                        { name: "Pinterest", url: `https://pinterest.com/${u}/` },
                        { name: "TikTok", url: `https://tiktok.com/@${u}` },
                        { name: "Spotify", url: `https://open.spotify.com/user/${u}` },
                        { name: "GitLab", url: `https://gitlab.com/${u}` },
                        { name: "Chess.com", url: `https://chess.com/member/${u}` },
                        { name: "Medium", url: `https://medium.com/@${u}` },
                        { name: "SoundCloud", url: `https://soundcloud.com/${u}` }
                    ];

                    resultsCount.innerText = `Найдено профилей: ${platforms.length}`;
                    scanStatus.innerText = 'Завершено';
                    html += '<div class="results-grid">';
                    for (const p of platforms) {
                        html += `
                            <a href="${p.url}" target="_blank" class="card-item">
                                <span class="card-title">${p.name}</span>
                                <span class="card-link-text">Открыть ↗</span>
                            </a>
                        `;
                    }
                    html += '</div>';
                }
                else if (currentTool === 'dns') {
                    const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const types = ['A', 'AAAA', 'MX', 'TXT', 'NS'];
                    html += '<div class="data-list">';

                    for (const t of types) {
                        try {
                            const res = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(cleanDomain)}&type=${t}`, {
                                headers: { 'Accept': 'application/dns-json' }
                            });
                            const data = await res.json();
                            if (data.Answer && data.Answer.length > 0) {
                                const vals = data.Answer.map(a => a.data).join(', ');
                                html += `
                                    <div class="data-row">
                                        <span class="data-k">${t} запись</span>
                                        <span class="data-v">${vals}</span>
                                    </div>
                                `;
                            }
                        } catch (e) {}
                    }
                    html += '</div>';
                    resultsCount.innerText = `DNS: ${cleanDomain}`;
                    scanStatus.innerText = 'Завершено';
                }
                else if (currentTool === 'subdomains') {
                    const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const res = await fetch(`https://crt.sh/?q=%25.${encodeURIComponent(cleanDomain)}&output=json`);
                    const data = await res.json();
                    const subs = new Set();

                    data.slice(0, 40).forEach(item => {
                        item.name_value.split('\n').forEach(s => {
                            s = s.trim().toLowerCase();
                            if (!s.includes('*') && s.endsWith(cleanDomain)) subs.add(s);
                        });
                    });

                    const list = Array.from(subs);
                    if (list.length > 0) {
                        resultsCount.innerText = `Поддоменов: ${list.length}`;
                        scanStatus.innerText = 'Завершено';
                        html += '<div class="results-grid">';
                        for (const s of list) {
                            html += `
                                <div class="card-item" style="cursor: default;">
                                    <span class="card-title" style="font-family: var(--mono); font-size: 13px;">${s}</span>
                                </div>
                            `;
                        }
                        html += '</div>';
                    } else {
                        resultsCount.innerText = 'Результаты';
                        scanStatus.innerText = '0 совпадений';
                        html = '<div class="placeholder-state"><span>Поддоменов в открытых SSL-реестрах не найдено.</span></div>';
                    }
                }
                else if (currentTool === 'ip') {
                    const cleanTarget = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const res = await fetch(`https://freeipapi.com/api/json/${encodeURIComponent(cleanTarget)}`);
                    const data = await res.json();

                    resultsCount.innerText = `IP: ${cleanTarget}`;
                    scanStatus.innerText = 'Завершено';
                    html += `
                        <div class="data-list">
                            <div class="data-row"><span class="data-k">IP адрес</span><span class="data-v">${data.ipAddress || cleanTarget}</span></div>
                            <div class="data-row"><span class="data-k">Страна</span><span class="data-v">${data.countryName || '—'}</span></div>
                            <div class="data-row"><span class="data-k">Город</span><span class="data-v">${data.cityName || '—'}</span></div>
                            <div class="data-row"><span class="data-k">Индекс</span><span class="data-v">${data.zipCode || '—'}</span></div>
                            <div class="data-row"><span class="data-k">Версия IP</span><span class="data-v">${data.ipVersion ? 'IPv' + data.ipVersion : '—'}</span></div>
                        </div>
                    `;
                }
                else if (currentTool === 'email') {
                    const cleanEmail = query.trim().toLowerCase();
                    const domain = cleanEmail.split('@')[1] || 'Не указан';
                    resultsCount.innerText = 'Сведения о почте';
                    scanStatus.innerText = 'Завершено';
                    html += `
                        <div class="data-list">
                            <div class="data-row"><span class="data-k">Адрес</span><span class="data-v">${cleanEmail}</span></div>
                            <div class="data-row"><span class="data-k">Почтовый домен</span><span class="data-v">${domain}</span></div>
                            <div class="data-row"><span class="data-k">Формат синтаксиса</span><span class="data-v">${cleanEmail.includes('@') ? 'Корректный' : 'Ошибка формата'}</span></div>
                        </div>
                    `;
                }

                resultsContent.innerHTML = html;
            } catch (e) {
                scanStatus.innerText = 'Ошибка';
                resultsContent.innerHTML = '<div class="placeholder-state"><span>Не удалось получить данные. Проверьте интернет.</span></div>';
            } finally {
                btnText.style.display = 'block';
                kbdHint.style.display = 'inline';
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
