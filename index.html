<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherlock — OSINT Workbench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090a0d;
            --surface: #111318;
            --surface-hover: #161920;
            --border: rgba(255, 255, 255, 0.07);
            --border-hover: rgba(255, 255, 255, 0.15);
            --text-primary: #f0f2f5;
            --text-secondary: #8a909d;
            --text-tertiary: #4e535e;
            --accent: #ffffff;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        /* 🧭 АККУРАТНАЯ ШАПКА */
        header {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: -0.2px;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo-mark {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
        }

        .status-badge {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #22c55e;
        }

        /* 📄 ЦЕНТРАЛЬНАЯ РАБОЧАЯ ЗОНА */
        main {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px 80px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* 🎛 СЕГМЕНТИРОВАННЫЙ ТАБ-БАР */
        .tab-nav {
            display: flex;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 4px;
            border-radius: var(--radius-md);
            margin-bottom: 28px;
            gap: 2px;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 9px 14px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
            text-align: center;
            user-select: none;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-weight: 600;
        }

        /* 🔍 ИНПУТ И ПОИСК */
        .search-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 6px 6px 6px 18px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: rgba(255, 255, 255, 0.28);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15);
        }

        .main-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 400;
            min-width: 0;
        }

        .main-input::placeholder {
            color: var(--text-tertiary);
        }

        .submit-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 18px;
            border-radius: calc(var(--radius-lg) - 4px);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .kbd-hint {
            font-family: var(--font-mono);
            font-size: 10px;
            color: rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.08);
            padding: 2px 5px;
            border-radius: 4px;
        }

        /* 🔖 ПОДСКАЗКИ И ПРЕСЕТЫ */
        .meta-hints {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-tertiary);
            padding-left: 4px;
            flex-wrap: wrap;
        }

        .preset-link {
            color: var(--text-secondary);
            cursor: pointer;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .preset-link:hover {
            color: #ffffff;
        }

        /* 📋 СПИСОК РЕЗУЛЬТАТОВ */
        .results-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .results-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-tertiary);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .count-tag {
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* КАРТОЧКИ СЕРВИСОВ (ЛОГИН) */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 8px;
        }

        .card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.15s ease;
        }

        .card:hover {
            background: var(--surface-hover);
            border-color: var(--border-hover);
        }

        .card-name {
            font-size: 13.5px;
            font-weight: 500;
        }

        .card-sub {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .card-arrow {
            color: var(--text-tertiary);
            font-size: 12px;
            transition: transform 0.15s ease;
        }

        .card:hover .card-arrow {
            color: #ffffff;
            transform: translate(2px, -2px);
        }

        /* СТРОКИ ДАННЫХ (DNS / IP / EMAIL) */
        .data-rows {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            font-size: 13.5px;
            gap: 16px;
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .data-key {
            color: var(--text-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .data-val {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-primary);
            text-align: right;
            word-break: break-all;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 7px;
            font-size: 11px;
            color: var(--text-tertiary);
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: var(--font-sans);
        }

        .copy-btn:hover {
            color: #ffffff;
            border-color: var(--border-hover);
        }

        /* ПОДДОМЕНЫ */
        .sub-tag-box {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .sub-tag {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            font-size: 12.5px;
            font-family: var(--font-mono);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .sub-tag:hover {
            color: #ffffff;
            background: var(--surface-hover);
            border-color: var(--border-hover);
        }

        /* ПУСТОЕ СОСТОЯНИЕ */
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-tertiary);
            font-size: 13px;
        }

        /* ТОСТ УВЕДОМЛЕНИЕ */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1c1f26;
            border: 1px solid var(--border-hover);
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 12.5px;
            color: #ffffff;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s var(--ease);
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            header, main { padding-left: 16px; padding-right: 16px; }
            .data-row { flex-direction: column; align-items: flex-start; gap: 6px; }
            .data-val { text-align: left; }
            .submit-btn .kbd-hint { display: none; }
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ СТРОКА -->
    <header>
        <a href="#" class="logo">
            <span class="logo-mark"></span>
            <span>Sherlock</span>
        </a>
        <div class="status-badge">
            <span class="status-dot"></span>
            <span>Сеть активна</span>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main>
        <!-- ТАБЫ ИНСТРУМЕНТОВ -->
        <nav class="tab-nav">
            <button class="tab-btn active" onclick="setTool('username')">Профиль</button>
            <button class="tab-btn" onclick="setTool('dns')">DNS</button>
            <button class="tab-btn" onclick="setTool('subdomains')">Субдомены</button>
            <button class="tab-btn" onclick="setTool('ip')">IP Хост</button>
            <button class="tab-btn" onclick="setTool('email')">Почта</button>
        </nav>

        <!-- ИНПУТ -->
        <div class="search-area">
            <div class="input-wrapper">
                <input type="text" id="targetInput" class="main-input" placeholder="Никнейм для поиска..." autocomplete="off" spellcheck="false">
                <button class="submit-btn" id="submitBtn" onclick="runSearch()">
                    <span id="btnLabel">Искать</span>
                    <span class="kbd-hint">↵</span>
                </button>
            </div>
            
            <div class="meta-hints" id="metaHints">
                <span>Примеры:</span>
                <span class="preset-link" onclick="setPreset('durov')">durov</span>
                <span>·</span>
                <span class="preset-link" onclick="setPreset('alex')">alex</span>
                <span>·</span>
                <span class="preset-link" onclick="setPreset('satoshi')">satoshi</span>
            </div>
        </div>

        <!-- РЕЗУЛЬТАТЫ -->
        <div class="results-box">
            <div class="results-bar">
                <span id="resStatus">Ожидание ввода</span>
                <span class="count-tag" id="resCount">0 элементов</span>
            </div>
            <div id="resultsContent">
                <div class="empty-state">
                    Введите параметр или выберите пример выше для начала проверки
                </div>
            </div>
        </div>
    </main>

    <!-- ТОСТ -->
    <div class="toast" id="toast">Скопировано в буфер</div>

    <script>
        let currentTool = 'username';

        const toolsConfig = {
            username: {
                placeholder: 'Никнейм для поиска (например: durov)...',
                presets: ['durov', 'alex', 'satoshi']
            },
            dns: {
                placeholder: 'Домен для получения DNS (например: cloudflare.com)...',
                presets: ['google.com', 'github.com', 'telegram.org']
            },
            subdomains: {
                placeholder: 'Домен для поиска субдоменов (например: spotify.com)...',
                presets: ['tesla.com', 'spotify.com', 'uber.com']
            },
            ip: {
                placeholder: 'IP адрес или узел (например: 1.1.1.1)...',
                presets: ['1.1.1.1', '8.8.8.8', '9.9.9.9']
            },
            email: {
                placeholder: 'Email адрес (например: contact@apple.com)...',
                presets: ['contact@apple.com', 'security@google.com']
            }
        };

        function setTool(tool) {
            currentTool = tool;
            
            // Активные вкладки
            const tabs = document.querySelectorAll('.tab-btn');
            const toolKeys = ['username', 'dns', 'subdomains', 'ip', 'email'];
            tabs.forEach((tab, i) => {
                tab.classList.toggle('active', toolKeys[i] === tool);
            });

            const cfg = toolsConfig[tool];
            const input = document.getElementById('targetInput');
            input.placeholder = cfg.placeholder;
            input.value = '';

            // Пресеты
            let hintsHtml = '<span>Примеры:</span>';
            cfg.presets.forEach((p, idx) => {
                hintsHtml += `<span class="preset-link" onclick="setPreset('${p}')">${p}</span>`;
                if (idx < cfg.presets.length - 1) hintsHtml += '<span>·</span>';
            });
            document.getElementById('metaHints').innerHTML = hintsHtml;

            // Сброс данных
            document.getElementById('resStatus').innerText = 'Ожидание ввода';
            document.getElementById('resCount').innerText = '0 элементов';
            document.getElementById('resultsContent').innerHTML = `
                <div class="empty-state">Введите параметр для анализа</div>
            `;
            input.focus();
        }

        function setPreset(val) {
            document.getElementById('targetInput').value = val;
            runSearch();
        }

        document.getElementById('targetInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') runSearch();
        });

        async function runSearch() {
            const query = document.getElementById('targetInput').value.trim();
            if (!query) return;

            const btn = document.getElementById('submitBtn');
            const label = document.getElementById('btnLabel');
            const resContent = document.getElementById('resultsContent');
            const resStatus = document.getElementById('resStatus');
            const resCount = document.getElementById('resCount');

            btn.disabled = true;
            label.innerText = 'Поиск...';
            resStatus.innerText = 'Запрос к базам данных...';

            try {
                if (currentTool === 'username') {
                    const u = query.replace('@', '');
                    const platforms = [
                        { name: "GitHub", desc: "Репозитории & Код", url: `https://github.com/${u}` },
                        { name: "Telegram", desc: "Мессенджер", url: `https://t.me/${u}` },
                        { name: "X / Twitter", desc: "Микроблог", url: `https://x.com/${u}` },
                        { name: "Reddit", desc: "Форум", url: `https://reddit.com/user/${u}` },
                        { name: "Steam", desc: "Игровой профиль", url: `https://steamcommunity.com/id/${u}` },
                        { name: "Twitch", desc: "Стриминг", url: `https://twitch.tv/${u}` },
                        { name: "GitLab", desc: "DevOps & Репозитории", url: `https://gitlab.com/${u}` },
                        { name: "Medium", desc: "Публикации", url: `https://medium.com/@${u}` },
                        { name: "TikTok", desc: "Видеохостинг", url: `https://tiktok.com/@${u}` },
                        { name: "Spotify", desc: "Музыка", url: `https://open.spotify.com/user/${u}` },
                        { name: "SoundCloud", desc: "Аудио", url: `https://soundcloud.com/${u}` },
                        { name: "Chess.com", desc: "Шахматы", url: `https://chess.com/member/${u}` }
                    ];

                    resStatus.innerText = `Прямые ссылки для @${u}`;
                    resCount.innerText = `${platforms.length} сервисов`;

                    let html = '<div class="grid-cards">';
                    platforms.forEach(p => {
                        html += `
                            <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="card">
                                <div>
                                    <div class="card-name">${p.name}</div>
                                    <div class="card-sub">${p.desc}</div>
                                </div>
                                <div class="card-arrow">↗</div>
                            </a>
                        `;
                    });
                    html += '</div>';
                    resContent.innerHTML = html;
                }
                else if (currentTool === 'dns') {
                    const domain = query.replace(/^https?:\/\//, '').split('/')[0].trim();
                    const types = ['A', 'AAAA', 'MX', 'TXT', 'NS', 'SOA'];
                    let records = [];

                    for (const t of types) {
                        try {
                            const res = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(domain)}&type=${t}`, {
                                headers: { 'Accept': 'application/dns-json' }
                            });
                            const data = await res.json();
                            if (data.Answer) {
                                data.Answer.forEach(ans => records.push({ type: t, data: ans.data }));
                            }
                        } catch (e) {}
                    }

                    resStatus.innerText = `DNS для ${domain}`;
                    resCount.innerText = `${records.length} записей`;

                    if (records.length === 0) {
                        resContent.innerHTML = '<div class="empty-state">DNS записи не найдены</div>';
                    } else {
                        let html = '<div class="data-rows">';
                        records.forEach(r => {
                            html += `
                                <div class="data-row">
                                    <span class="data-key">${r.type}</span>
                                    <div class="data-val">
                                        <span>${escapeHtml(r.data)}</span>
                                        <button class="copy-btn" onclick="copyText('${escapeHtml(r.data)}')">Копия</button>
                                    </div>
                                </div>
                            `;
                        });
                        html += '</div>';
                        resContent.innerHTML = html;
                    }
                }
                else if (currentTool === 'subdomains') {
                    const domain = query.replace(/^https?:\/\//, '').split('/')[0].trim();
                    const res = await fetch(`https://crt.sh/?q=%25.${encodeURIComponent(domain)}&output=json`);
                    const data = await res.json();
                    const subs = new Set();

                    data.slice(0, 80).forEach(item => {
                        item.name_value.split('\n').forEach(s => {
                            s = s.trim().toLowerCase();
                            if (!s.includes('*') && s.endsWith(domain)) subs.add(s);
                        });
                    });

                    const list = Array.from(subs).sort();
                    resStatus.innerText = `Субдомены ${domain}`;
                    resCount.innerText = `${list.length} найдено`;

                    if (list.length === 0) {
                        resContent.innerHTML = '<div class="empty-state">Субдоменов в журналах SSL не найдено</div>';
                    } else {
                        let html = '<div class="sub-tag-box">';
                        list.forEach(s => {
                            html += `<div class="sub-tag" onclick="copyText('${s}')">${s}</div>`;
                        });
                        html += '</div>';
                        resContent.innerHTML = html;
                    }
                }
                else if (currentTool === 'ip') {
                    const cleanTarget = query.replace(/^https?:\/\//, '').split('/')[0].trim();
                    const res = await fetch(`https://freeipapi.com/api/json/${encodeURIComponent(cleanTarget)}`);
                    const d = await res.json();

                    resStatus.innerText = `Хост ${d.ipAddress || cleanTarget}`;
                    resCount.innerText = d.countryCode || 'Готово';

                    let html = `
                        <div class="data-rows">
                            <div class="data-row"><span class="data-key">IP Адрес</span><span class="data-val">${d.ipAddress || cleanTarget}</span></div>
                            <div class="data-row"><span class="data-key">Страна / Регион</span><span class="data-val">${d.countryName || '—'}, ${d.regionName || '—'}</span></div>
                            <div class="data-row"><span class="data-key">Город</span><span class="data-val">${d.cityName || '—'}</span></div>
                            <div class="data-row"><span class="data-key">Координаты</span><span class="data-val">${d.latitude || '0'}, ${d.longitude || '0'}</span></div>
                            <div class="data-row"><span class="data-key">Часовой пояс</span><span class="data-val">${d.timeZones ? d.timeZones[0] : '—'}</span></div>
                        </div>
                    `;
                    resContent.innerHTML = html;
                }
                else if (currentTool === 'email') {
                    const clean = query.trim().toLowerCase();
                    const domain = clean.includes('@') ? clean.split('@')[1] : '';
                    let mxFound = false;

                    if (domain) {
                        try {
                            const res = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(domain)}&type=MX`, {
                                headers: { 'Accept': 'application/dns-json' }
                            });
                            const d = await res.json();
                            if (d.Answer && d.Answer.length > 0) mxFound = true;
                        } catch (e) {}
                    }

                    resStatus.innerText = `Анализ адреса`;
                    resCount.innerText = 'Завершено';

                    let html = `
                        <div class="data-rows">
                            <div class="data-row"><span class="data-key">Адрес</span><span class="data-val">${clean}</span></div>
                            <div class="data-row"><span class="data-key">Формат RFC</span><span class="data-val">${clean.includes('@') ? 'Корректный' : 'Ошибка структуры'}</span></div>
                            <div class="data-row"><span class="data-key">Домен</span><span class="data-val">${domain || '—'}</span></div>
                            <div class="data-row"><span class="data-key">MX Сервер</span><span class="data-val">${mxFound ? 'Обнаружен (Активен)' : 'Не найден / Ошибка'}</span></div>
                        </div>
                    `;
                    resContent.innerHTML = html;
                }
            } catch (err) {
                resStatus.innerText = 'Ошибка запроса';
                resContent.innerHTML = '<div class="empty-state">Не удалось получить данные. Проверьте запрос.</div>';
            } finally {
                btn.disabled = false;
                label.innerText = 'Искать';
            }
        }

        function copyText(str) {
            navigator.clipboard.writeText(str);
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
