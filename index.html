<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sherlock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Подключаем Unbounded (широкий растянутый шрифт) -->
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --main-color: #f7e479;
            --main-color-opacity: rgba(247, 228, 121, 0.12);
            --total-radio: 5;

            --bg: #08090c;
            --surface: rgba(18, 20, 27, 0.6);
            --border: rgba(255, 255, 255, 0.08);

            --text-main: #f0f2f5;
            --text-muted: #525663;

            --font-stretched: 'Unbounded', sans-serif;
            --font-ui: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-ui);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.015) 0%, transparent 60%),
                linear-gradient(180deg, #08090c 0%, #050608 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 🔘 ЧИСТАЯ СТАТИЧНАЯ SVG КНОПКА МЕНЮ */
        .hud-menu-btn {
            position: fixed;
            top: 28px;
            left: 28px;
            z-index: 90;
            background: transparent;
            border: none;
            padding: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.35);
            transition: color 0.3s ease, filter 0.3s ease;
        }

        .hud-menu-btn svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
        }

        .hud-menu-btn:hover,
        .hud-menu-btn.active {
            color: var(--main-color);
            filter: drop-shadow(0 0 8px rgba(247, 228, 121, 0.5));
        }

        /* 🪟 ВЫЕЗЖАЮЩАЯ СЛЕВА ПАНЕЛЬ С ГЛАЙДЕРОМ */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s var(--ease);
            z-index: 100;
        }

        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .side-drawer {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            background: rgba(11, 13, 17, 0.95);
            border-right: 1px solid var(--border);
            backdrop-filter: blur(30px);
            z-index: 110;
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.3s var(--ease);
            box-shadow: 20px 0 60px rgba(0, 0, 0, 0.9);
        }

        .side-drawer.active {
            transform: translateX(0);
        }

        .drawer-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .drawer-brand {
            font-family: var(--font-stretched);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: var(--main-color);
            text-transform: uppercase;
        }

        .drawer-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.2s;
        }

        .drawer-close:hover {
            color: #fff;
        }

        /* 🌟 ЛАЗЕРНЫЙ ГЛАЙДЕР В МЕНЮ */
        .radio-container {
            --total-radio: 5;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-left: 0.5rem;
        }

        .radio-container input {
            cursor: pointer;
            appearance: none;
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .radio-container .glider-container {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255,255,255,0.15) 50%, rgba(0,0,0,0) 100%);
            width: 1.5px;
        }

        .radio-container .glider-container .glider {
            position: relative;
            height: calc(100% / var(--total-radio));
            width: 100%;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, var(--main-color) 50%, rgba(0,0,0,0) 100%);
            transition: transform 0.4s cubic-bezier(0.37, 1.4, 0.66, 1);
        }

        .radio-container .glider-container .glider::before {
            content: "";
            position: absolute;
            height: 60%;
            width: 350%;
            top: 50%;
            transform: translateY(-50%);
            background: var(--main-color);
            filter: blur(8px);
        }

        .radio-container .glider-container .glider::after {
            content: "";
            position: absolute;
            left: 0;
            height: 100%;
            width: 160px;
            background: linear-gradient(90deg, var(--main-color-opacity) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        .radio-container label {
            cursor: pointer;
            padding: 1rem 1.1rem;
            position: relative;
            color: #606472;
            font-size: 13.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: color 0.25s ease;
            user-select: none;
        }

        .radio-container label svg {
            width: 16px;
            height: 16px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
        }

        .radio-container input:checked + label {
            color: var(--main-color);
        }

        .radio-container input:nth-of-type(1):checked ~ .glider-container .glider { transform: translateY(0); }
        .radio-container input:nth-of-type(2):checked ~ .glider-container .glider { transform: translateY(100%); }
        .radio-container input:nth-of-type(3):checked ~ .glider-container .glider { transform: translateY(200%); }
        .radio-container input:nth-of-type(4):checked ~ .glider-container .glider { transform: translateY(300%); }
        .radio-container input:nth-of-type(5):checked ~ .glider-container .glider { transform: translateY(400%); }

        /* ⎯⎯⎯ ОТКРЫТАЯ РАБОЧАЯ ОБЛАСТЬ ⎯⎯⎯ */
        .workspace {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            padding: 110px 20px 80px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .title-block {
            display: flex;
            flex-direction: column;
        }

        /* 🌟 ТОТ САМЫЙ РАСТЯНУТЫЙ И ТОЛСТЫЙ ШРИФТ */
        .main-title {
            font-family: var(--font-stretched);
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.01em;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* 🔍 СТРОКА ВВОДА */
        .input-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        /* 🚫 ПОЛЕ ВВОДА: НИКАКОЙ ПОДСВЕТКИ, ОБВОДКИ ИЛИ ВСПЛЫВАНИЯ */
        .field-input {
            flex: 1;
            height: 44px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: none;
        }

        .field-input:focus {
            outline: none;
            box-shadow: none;
            border-color: var(--border); /* Цвет остается полностью статичным */
            background: var(--surface);
        }

        .field-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        /* 🌟 КНОПКА В ТОЧНОМ СТИЛЕ ПУНКТОВ МЕНЮ (СТАТИЧНАЯ) */
        .menu-style-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            height: 44px;
            padding: 0 24px;
            color: #606472;
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease;
        }

        .menu-style-btn:hover {
            color: var(--main-color);
            border-color: rgba(247, 228, 121, 0.25);
            background: linear-gradient(90deg, rgba(247, 228, 121, 0.04) 0%, var(--surface) 100%);
        }

        /* 📋 РЕЗУЛЬТАТЫ */
        .results-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 10px;
        }

        .meta-line {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        /* СЕТКА (СУБДОМЕНЫ / ПРОФИЛИ) — СТАТИКА */
        .deck-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
        }

        .deck-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 13px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: border-color 0.2s ease;
        }

        .deck-card:hover {
            border-color: rgba(255, 255, 255, 0.16);
        }

        .deck-card svg {
            width: 13px;
            height: 13px;
            stroke: var(--text-muted);
            flex-shrink: 0;
            transition: stroke 0.2s ease;
        }

        .deck-card:hover svg {
            stroke: #ffffff;
        }

        /* ТАБЛИЦА (DNS / IP / EMAIL) — СТАТИКА */
        .data-table {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 18px;
            border-bottom: 1px solid var(--border);
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .data-key {
            font-size: 13px;
            color: var(--text-muted);
        }

        .data-val-group {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 65%;
        }

        .data-val {
            font-family: var(--font-mono);
            font-size: 13px;
            color: #ffffff;
            word-break: break-all;
            text-align: right;
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 4px;
            border-radius: 4px;
            transition: color 0.15s ease;
        }

        .copy-btn:hover {
            color: #ffffff;
        }

        .copy-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .blank-state {
            padding: 50px 0;
            color: var(--text-muted);
            font-size: 13px;
            font-family: var(--font-mono);
            text-align: center;
        }

        .spinner {
            display: none;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--main-color);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: #090a0d;
            font-size: 12px;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 120;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .hud-menu-btn { top: 20px; left: 20px; }
            .workspace { padding: 90px 16px 40px; }
            .deck-grid { grid-template-columns: 1fr; }
            .main-title { font-size: 21px; }
        }
    </style>
</head>
<body>

    <!-- 🔘 ЧИСТАЯ СТАТИЧНАЯ ИКОНКА МЕНЮ -->
    <button class="hud-menu-btn" id="menuBtn" onclick="toggleMenu()" title="Инструменты">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="16" y2="12"></line>
            <line x1="3" y1="18" x2="20" y2="18"></line>
        </svg>
    </button>

    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleMenu()"></div>

    <!-- ВЫЕЗЖАЮЩАЯ СЛЕВА ПАНЕЛЬ С ГЛАЙДЕРОМ -->
    <aside class="side-drawer" id="sideDrawer">
        <div class="drawer-head">
            <span class="drawer-brand">Инструменты</span>
            <button class="drawer-close" onclick="toggleMenu()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="radio-container">
            <input type="radio" id="tool-sub" name="osint-radio" value="subdomains" checked onchange="selectTool(this)">
            <label for="tool-sub">
                <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                <span>Субдомены</span>
            </label>

            <input type="radio" id="tool-user" name="osint-radio" value="username" onchange="selectTool(this)">
            <label for="tool-user">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Никнейм</span>
            </label>

            <input type="radio" id="tool-dns" name="osint-radio" value="dns" onchange="selectTool(this)">
            <label for="tool-dns">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                <span>DNS записи</span>
            </label>

            <input type="radio" id="tool-ip" name="osint-radio" value="ip" onchange="selectTool(this)">
            <label for="tool-ip">
                <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                <span>IP хост</span>
            </label>

            <input type="radio" id="tool-mail" name="osint-radio" value="email" onchange="selectTool(this)">
            <label for="tool-mail">
                <svg viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
                <span>Почтовый адрес</span>
            </label>

            <div class="glider-container">
                <div class="glider"></div>
            </div>
        </div>
    </aside>

    <!-- 💻 ОТКРЫТАЯ РАБОЧАЯ ОБЛАСТЬ -->
    <main class="workspace">
        <div class="title-block">
            <h1 class="main-title" id="toolTitle">Субдомены</h1>
        </div>

        <div class="input-row">
            <input type="text" id="targetInput" class="field-input" placeholder="Корневой домен (например: spotify.com)..." autocomplete="off" spellcheck="false">
            <button class="menu-style-btn" id="runBtn" onclick="runInvestigation()">
                <span id="btnText">Поиск</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </div>

        <!-- РЕЗУЛЬТАТЫ -->
        <div class="results-section">
            <div class="meta-line" id="statusLine">Ожидание</div>
            <div id="resultsViewport">
                <div class="blank-state">Укажите цель для инициализации поиска</div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast">Скопировано в буфер</div>

    <script>
        let currentTool = 'subdomains';

        const toolConfig = {
            subdomains: {
                title: 'Субдомены',
                placeholder: 'Корневой домен (например: spotify.com)...'
            },
            username: {
                title: 'Никнейм',
                placeholder: 'Введите никнейм цели (например: durov)...'
            },
            dns: {
                title: 'DNS записи',
                placeholder: 'Домен для проверки (например: github.com)...'
            },
            ip: {
                title: 'IP хост',
                placeholder: 'IP адрес (например: 1.1.1.1)...'
            },
            email: {
                title: 'Почтовый адрес',
                placeholder: 'Email адрес (например: dev@apple.com)...'
            }
        };

        function toggleMenu() {
            const drawer = document.getElementById('sideDrawer');
            const overlay = document.getElementById('drawerOverlay');
            const menuBtn = document.getElementById('menuBtn');

            const isOpen = drawer.classList.toggle('active');
            overlay.classList.toggle('active');
            menuBtn.classList.toggle('active', isOpen);
        }

        function selectTool(radio) {
            currentTool = radio.value;
            const c = toolConfig[currentTool];

            document.getElementById('toolTitle').innerText = c.title;

            const input = document.getElementById('targetInput');
            input.placeholder = c.placeholder;
            input.value = '';

            document.getElementById('statusLine').innerText = 'Ожидание';
            document.getElementById('resultsViewport').innerHTML = `
                <div class="blank-state">Укажите цель для инициализации поиска</div>
            `;

            setTimeout(toggleMenu, 160);
            input.focus();
        }

        function copyData(val) {
            navigator.clipboard.writeText(val);
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1500);
        }

        document.getElementById('targetInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') runInvestigation();
        });

        async function runInvestigation() {
            const query = document.getElementById('targetInput').value.trim();
            if (!query) return;

            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const resultsViewport = document.getElementById('resultsViewport');
            const statusLine = document.getElementById('statusLine');

            btnText.style.display = 'none';
            spinner.style.display = 'block';
            statusLine.innerText = 'Обработка запроса...';

            try {
                let html = '';

                if (currentTool === 'subdomains') {
                    const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const res = await fetch(`https://crt.sh/?q=%25.${encodeURIComponent(cleanDomain)}&output=json`);
                    const data = await res.json();
                    const subSet = new Set();

                    data.slice(0, 36).forEach(item => {
                        item.name_value.split('\n').forEach(s => {
                            s = s.trim().toLowerCase();
                            if (!s.includes('*') && s.endsWith(cleanDomain)) subSet.add(s);
                        });
                    });

                    const list = Array.from(subSet);
                    if (list.length > 0) {
                        statusLine.innerText = `Найдено: ${list.length} поддоменов`;

                        html += '<div class="deck-grid">';
                        for (const sub of list) {
                            html += `
                                <div class="deck-card" onclick="copyData('${sub}')" style="cursor: pointer;">
                                    <span style="font-family: var(--font-mono); font-size: 12px;">${sub}</span>
                                    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                        <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                                        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
                                    </svg>
                                </div>
                            `;
                        }
                        html += '</div>';
                    } else {
                        html = '<div class="blank-state">В открытых реестрах записей не обнаружено</div>';
                        statusLine.innerText = '0 результатов';
                    }
                }
                else if (currentTool === 'username') {
                    const u = query.replace('@', '');
                    const platforms = [
                        { name: "GitHub", url: `https://github.com/${u}` },
                        { name: "Telegram", url: `https://t.me/${u}` },
                        { name: "Reddit", url: `https://reddit.com/user/${u}` },
                        { name: "Steam", url: `https://steamcommunity.com/id/${u}` },
                        { name: "Twitch", url: `https://twitch.tv/${u}` },
                        { name: "Pinterest", url: `https://pinterest.com/${u}/` },
                        { name: "TikTok", url: `https://tiktok.com/@${u}` },
                        { name: "Spotify", url: `https://open.spotify.com/user/${u}` },
                        { name: "GitLab", url: `https://gitlab.com/${u}` },
                        { name: "Chess.com", url: `https://chess.com/member/${u}` },
                        { name: "Medium", url: `https://medium.com/@${u}` },
                        { name: "SoundCloud", url: `https://soundcloud.com/${u}` }
                    ];

                    statusLine.innerText = `Платформ: ${platforms.length}`;

                    html += '<div class="deck-grid">';
                    for (const p of platforms) {
                        html += `
                            <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="deck-card">
                                <span>${p.name}</span>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="7" y1="17" x2="17" y2="7"></line>
                                    <polyline points="7 7 17 7 17 17"></polyline>
                                </svg>
                            </a>
                        `;
                    }
                    html += '</div>';
                }
                else if (currentTool === 'dns') {
                    const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const types = ['A', 'AAAA', 'MX', 'TXT', 'NS'];
                    let found = 0;
                    let rows = '';

                    for (const t of types) {
                        try {
                            const res = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(cleanDomain)}&type=${t}`, {
                                headers: { 'Accept': 'application/dns-json' }
                            });
                            const data = await res.json();
                            if (data.Answer && data.Answer.length > 0) {
                                found++;
                                const valStr = data.Answer.map(a => a.data).join(', ');
                                rows += `
                                    <div class="data-row">
                                        <span class="data-key">${t}</span>
                                        <div class="data-val-group">
                                            <span class="data-val">${valStr}</span>
                                            <button class="copy-btn" title="Копировать" onclick="copyData('${valStr.replace(/'/g, "\\'")}')">
                                                <svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                                            </button>
                                        </div>
                                    </div>
                                `;
                            }
                        } catch (e) {}
                    }

                    if (found > 0) {
                        html = `<div class="data-table">${rows}</div>`;
                        statusLine.innerText = `Домен: ${cleanDomain}`;
                    } else {
                        html = '<div class="blank-state">Записи DNS не обнаружены</div>';
                        statusLine.innerText = '0 результатов';
                    }
                }
                else if (currentTool === 'ip') {
                    const cleanTarget = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const res = await fetch(`https://freeipapi.com/api/json/${encodeURIComponent(cleanTarget)}`);
                    const data = await res.json();

                    statusLine.innerText = `IP: ${cleanTarget}`;

                    const rows = [
                        ['IP Хоста', data.ipAddress || cleanTarget],
                        ['Локация', `${data.countryName || '—'}, ${data.cityName || '—'}`],
                        ['Индекс зоны', data.zipCode || '—'],
                        ['Таймзона', data.timeZone || '—'],
                        ['Версия IP', data.ipVersion ? `IPv${data.ipVersion}` : '—']
                    ];

                    html += '<div class="data-table">';
                    rows.forEach(([k, v]) => {
                        html += `
                            <div class="data-row">
                                <span class="data-key">${k}</span>
                                <div class="data-val-group">
                                    <span class="data-val">${v}</span>
                                    <button class="copy-btn" onclick="copyData('${v}')">
                                        <svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }
                else if (currentTool === 'email') {
                    const cleanEmail = query.trim().toLowerCase();
                    const domain = cleanEmail.split('@')[1] || '—';
                    const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail);

                    statusLine.innerText = cleanEmail;

                    const rows = [
                        ['Целевой адрес', cleanEmail],
                        ['Доменная зона', domain],
                        ['Формат RFC 5322', isValid ? 'Валиден' : 'Ошибка формата']
                    ];

                    html += '<div class="data-table">';
                    rows.forEach(([k, v]) => {
                        html += `
                            <div class="data-row">
                                <span class="data-key">${k}</span>
                                <div class="data-val-group">
                                    <span class="data-val">${v}</span>
                                    <button class="copy-btn" onclick="copyData('${v}')">
                                        <svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                resultsViewport.innerHTML = html;
            } catch (e) {
                statusLine.innerText = 'Ошибка';
                resultsViewport.innerHTML = '<div class="blank-state">Сетевая ошибка или блок шлюза API</div>';
            } finally {
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
