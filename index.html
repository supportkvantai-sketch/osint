<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sherlock — Intelligence HUD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --main-color: #f7e479;
            --main-color-opacity: rgba(247, 228, 121, 0.12);
            --total-radio: 5;

            --bg: #07080b;
            --glass-bg: rgba(13, 16, 23, 0.72);
            --glass-card: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-hover: rgba(247, 228, 121, 0.35);

            --text: #f0f2f5;
            --text-dim: #7d8392;
            --font-ui: 'Outfit', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-ui);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(247, 228, 121, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(20, 26, 40, 0.6) 0%, transparent 50%),
                linear-gradient(180deg, #07080b 0%, #050608 100%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ⎯⎯⎯ ПАРЯЩИЕ ЭЛЕМЕНТЫ HUD (ВМЕСТО ВЕРХНЕГО БАРА) ⎯⎯⎯ */
        .hud-controls {
            position: fixed;
            top: 24px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            pointer-events: none;
        }

        .hud-trigger-btn {
            pointer-events: auto;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            height: 46px;
            padding: 0 18px;
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s var(--ease);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .hud-trigger-btn:hover {
            border-color: var(--glass-border-hover);
            color: var(--main-color);
            transform: translateY(-1px);
        }

        .hud-trigger-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
        }

        .hud-badge {
            pointer-events: auto;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            height: 46px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-dim);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .hud-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--main-color);
            box-shadow: 0 0 10px var(--main-color);
        }

        /* ⎯⎯⎯ ВЫЕЗЖАЮЩЕЕ СЛЕВА МЕНЮ С ВАШИМ ГЛАЙДЕРОМ ⎯⎯⎯ */
        .drawer-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s var(--ease);
            z-index: 90;
        }

        .drawer-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .side-drawer {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 300px;
            background: rgba(10, 12, 18, 0.88);
            border-right: 1px solid var(--glass-border);
            backdrop-filter: blur(35px) saturate(180%);
            -webkit-backdrop-filter: blur(35px) saturate(180%);
            box-shadow: 25px 0 60px rgba(0, 0, 0, 0.7);
            z-index: 100;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.35s var(--ease);
        }

        .side-drawer.active {
            transform: translateX(0);
        }

        .drawer-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 22px;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 20px;
        }

        .drawer-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--main-color);
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
            width: 32px;
            height: 32px;
            border-radius: 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-btn:hover {
            color: #fff;
            border-color: var(--glass-border-hover);
        }

        /* 🌟 ВАШ CSS КОМПОНЕНТ: ЛАЗЕРНЫЙ РАДИО-СЕЛЕКТОР */
        .radio-container {
            --main-color: #f7e479;
            --main-color-opacity: rgba(247, 228, 121, 0.12);
            --total-radio: 5;

            display: flex;
            flex-direction: column;
            position: relative;
            padding-left: 0.5rem;
        }

        .radio-container input {
            cursor: pointer;
            appearance: none;
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .radio-container .glider-container {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background: linear-gradient(
                0deg,
                rgba(0, 0, 0, 0) 0%,
                rgba(255, 255, 255, 0.12) 50%,
                rgba(0, 0, 0, 0) 100%
            );
            width: 1px;
        }

        .radio-container .glider-container .glider {
            position: relative;
            height: calc(100% / var(--total-radio));
            width: 100%;
            background: linear-gradient(
                0deg,
                rgba(0, 0, 0, 0) 0%,
                var(--main-color) 50%,
                rgba(0, 0, 0, 0) 100%
            );
            transition: transform 0.4s cubic-bezier(0.37, 1.4, 0.66, 1);
        }

        .radio-container .glider-container .glider::before {
            content: "";
            position: absolute;
            height: 60%;
            width: 300%;
            top: 50%;
            transform: translateY(-50%);
            background: var(--main-color);
            filter: blur(8px);
        }

        .radio-container .glider-container .glider::after {
            content: "";
            position: absolute;
            left: 0;
            height: 100%;
            width: 160px;
            background: linear-gradient(
                90deg,
                var(--main-color-opacity) 0%,
                rgba(0, 0, 0, 0) 100%
            );
            pointer-events: none;
        }

        .radio-container label {
            cursor: pointer;
            padding: 1rem 1.2rem;
            position: relative;
            color: #727785;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.25s ease-in-out;
            user-select: none;
        }

        .radio-container label svg {
            width: 17px;
            height: 17px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
        }

        .radio-container input:checked + label {
            color: var(--main-color);
        }

        .radio-container input:nth-of-type(1):checked ~ .glider-container .glider { transform: translateY(0); }
        .radio-container input:nth-of-type(2):checked ~ .glider-container .glider { transform: translateY(100%); }
        .radio-container input:nth-of-type(3):checked ~ .glider-container .glider { transform: translateY(200%); }
        .radio-container input:nth-of-type(4):checked ~ .glider-container .glider { transform: translateY(300%); }
        .radio-container input:nth-of-type(5):checked ~ .glider-container .glider { transform: translateY(400%); }

        /* ⎯⎯⎯ ОСНОВНОЙ РАБОЧИЙ ХАБ ⎯⎯⎯ */
        .workspace {
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
            padding: 120px 24px 80px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .module-indicator {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .module-headline {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
            text-transform: uppercase;
        }

        .module-id {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 0.06em;
        }

        /* ⎯⎯⎯ СТЕКЛЯННОЕ ПОЛЕ ВВОДА ⎯⎯⎯ */
        .input-glass-box {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 7px 7px 7px 20px;
            display: flex;
            align-items: center;
            transition: all 0.25s var(--ease);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .input-glass-box:focus-within {
            border-color: var(--glass-border-hover);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(247, 228, 121, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .hud-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            min-width: 0;
        }

        .hud-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .action-btn {
            background: var(--main-color);
            color: #07080b;
            border: none;
            border-radius: 12px;
            height: 44px;
            padding: 0 22px;
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s var(--ease);
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(247, 228, 121, 0.25);
        }

        .action-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(247, 228, 121, 0.4);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* ⎯⎯⎯ ТЕРМИНАЛ ВЫВОДА РЕЗУЛЬТАТОВ ⎯⎯⎯ */
        .terminal-zone {
            margin-top: 38px;
        }

        .terminal-meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 18px;
        }

        /* 🌟 ВАШ CSS КОМПОНЕНТ: СТЕКЛЯННЫЕ КАРТОЧКИ (ADAPTIVE GRID) */
        .glass-deck {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 12px;
        }

        .glass-card-item {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 100%);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 16px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition: all 0.25s var(--ease);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .glass-card-item:hover {
            transform: translateY(-3px);
            border-color: var(--glass-border-hover);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(247, 228, 121, 0.03) 100%);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 15px rgba(247, 228, 121, 0.1);
        }

        .card-inner-title {
            font-size: 14px;
            font-weight: 600;
        }

        .card-inner-sub {
            font-family: var(--font-mono);
            font-size: 11.5px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .card-external-arrow {
            width: 14px;
            height: 14px;
            stroke: var(--text-dim);
            stroke-width: 2;
            transition: all 0.2s;
        }

        .glass-card-item:hover .card-external-arrow {
            stroke: var(--main-color);
            transform: translate(2px, -2px);
        }

        /* СТРОКИ ДАННЫХ ДЛЯ DNS / IP / EMAIL */
        .glass-data-table {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .data-unit-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 22px;
            border-bottom: 1px solid var(--glass-border);
            transition: background 0.15s;
        }

        .data-unit-row:last-child {
            border-bottom: none;
        }

        .data-unit-row:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .data-unit-key {
            font-size: 13px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .data-unit-val-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 68%;
        }

        .data-unit-val {
            font-family: var(--font-mono);
            font-size: 13px;
            color: #ffffff;
            word-break: break-all;
            text-align: right;
            font-weight: 500;
        }

        .copy-click-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 5px;
            border-radius: 6px;
            transition: all 0.15s;
        }

        .copy-click-btn:hover {
            color: var(--main-color);
            background: rgba(247, 228, 121, 0.1);
        }

        .copy-click-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* ПУСТОЕ СОСТОЯНИЕ */
        .empty-placeholder-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 70px 0;
            color: var(--text-dim);
            font-size: 13px;
            font-family: var(--font-mono);
        }

        .spinner-loader {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #07080b;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ТОСТ УВЕДОМЛЕНИЕ */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--main-color);
            color: #07080b;
            font-size: 12px;
            font-weight: 700;
            padding: 9px 20px;
            border-radius: 99px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s var(--ease);
            z-index: 120;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 📱 МОБИЛЬНАЯ ОПТИМИЗАЦИЯ ПОД СМАРТФОНЫ */
        @media (max-width: 650px) {
            .hud-controls {
                top: 16px;
                left: 16px;
                right: 16px;
            }
            .hud-badge span:last-child {
                display: none;
            }
            .workspace {
                padding: 90px 16px 60px;
            }
            .module-headline {
                font-size: 24px;
            }
            .glass-deck {
                grid-template-columns: 1fr;
            }
            .side-drawer {
                width: 275px;
            }
        }
    </style>
</head>
<body>

    <!-- ПАРЯЩИЕ HUD-КНОПКИ -->
    <div class="hud-controls">
        <button class="hud-trigger-btn" onclick="toggleDrawer()">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
            <span>Меню</span>
        </button>

        <div class="hud-badge">
            <div class="hud-dot"></div>
            <span>SYS_ONLINE // 1.0.4</span>
        </div>
    </div>

    <!-- ЗАТЕМНЕНИЕ ФОНА -->
    <div class="drawer-backdrop" id="drawerBackdrop" onclick="toggleDrawer()"></div>

    <!-- ВЫЕЗЖАЮЩАЯ СЛЕВА ПАНЕЛЬ С ВАШИМ РАДИО-ГЛАЙДЕРОМ -->
    <aside class="side-drawer" id="sideDrawer">
        <div class="drawer-head">
            <span class="drawer-title">Навигация</span>
            <button class="close-btn" onclick="toggleDrawer()">✕</button>
        </div>

        <div class="radio-container">
            <input type="radio" id="radio-user" name="tool" value="username" checked onchange="handleModuleSelect(this)">
            <label for="radio-user">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Никнейм</span>
            </label>

            <input type="radio" id="radio-dns" name="tool" value="dns" onchange="handleModuleSelect(this)">
            <label for="radio-dns">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"></path></svg>
                <span>DNS записи</span>
            </label>

            <input type="radio" id="radio-subs" name="tool" value="subdomains" onchange="handleModuleSelect(this)">
            <label for="radio-subs">
                <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                <span>Субдомены</span>
            </label>

            <input type="radio" id="radio-ip" name="tool" value="ip" onchange="handleModuleSelect(this)">
            <label for="radio-ip">
                <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                <span>IP хост</span>
            </label>

            <input type="radio" id="radio-mail" name="tool" value="email" onchange="handleModuleSelect(this)">
            <label for="radio-mail">
                <svg viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
                <span>Email почта</span>
            </label>

            <div class="glider-container">
                <div class="glider"></div>
            </div>
        </div>
    </aside>

    <!-- ОСНОВНАЯ КОНСОЛЬ -->
    <main class="workspace">
        <div class="module-indicator">
            <h1 class="module-headline" id="moduleTitle">Никнейм</h1>
            <span class="module-id" id="moduleId">MODULE // USR_QUERY</span>
        </div>

        <div class="input-glass-box">
            <input type="text" id="targetInput" class="hud-input" placeholder="Введите никнейм..." autocomplete="off" spellcheck="false">
            <button class="action-btn" id="runBtn" onclick="runScan()">
                <span id="btnText">Поиск</span>
                <div class="spinner-loader" id="spinner"></div>
            </button>
        </div>

        <div class="terminal-zone">
            <div class="terminal-meta-bar">
                <span id="statusCount">Ожидание ввода</span>
                <span id="statusCode">READY</span>
            </div>

            <div id="outputArea">
                <div class="empty-placeholder-box">
                    <span>— Задайте цель поиска в строке выше —</span>
                </div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast">Скопировано в буфер</div>

    <script>
        let currentModule = 'username';

        const modulesConfig = {
            username: {
                title: 'Никнейм',
                id: 'MODULE // USR_QUERY',
                placeholder: 'Введите никнейм...'
            },
            dns: {
                title: 'DNS записи',
                id: 'MODULE // DOH_LOOKUP',
                placeholder: 'Домен для анализа (например: github.com)...'
            },
            subdomains: {
                title: 'Субдомены',
                id: 'MODULE // SSL_CRT_LOGS',
                placeholder: 'Корневой домен (например: spotify.com)...'
            },
            ip: {
                title: 'IP хост',
                id: 'MODULE // NET_GEO_HOST',
                placeholder: 'IP адрес или хост (например: 1.1.1.1)...'
            },
            email: {
                title: 'Email почта',
                id: 'MODULE // RFC_VALIDATE',
                placeholder: 'Почтовый адрес (например: dev@apple.com)...'
            }
        };

        function toggleDrawer() {
            document.getElementById('sideDrawer').classList.toggle('active');
            document.getElementById('drawerBackdrop').classList.toggle('active');
        }

        function handleModuleSelect(radio) {
            currentModule = radio.value;
            const c = modulesConfig[currentModule];

            document.getElementById('moduleTitle').innerText = c.title;
            document.getElementById('moduleId').innerText = c.id;

            const input = document.getElementById('targetInput');
            input.placeholder = c.placeholder;
            input.value = '';

            document.getElementById('statusCount').innerText = 'Ожидание ввода';
            document.getElementById('statusCode').innerText = 'READY';
            document.getElementById('outputArea').innerHTML = `
                <div class="empty-placeholder-box">
                    <span>— Задайте цель поиска в строке выше —</span>
                </div>
            `;

            // Закрываем меню плавно
            setTimeout(toggleDrawer, 180);
            input.focus();
        }

        function copyValue(val) {
            navigator.clipboard.writeText(val);
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1600);
        }

        document.getElementById('targetInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') runScan();
        });

        async function runScan() {
            const query = document.getElementById('targetInput').value.trim();
            if (!query) return;

            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const outputArea = document.getElementById('outputArea');
            const statusCount = document.getElementById('statusCount');
            const statusCode = document.getElementById('statusCode');

            btnText.style.display = 'none';
            spinner.style.display = 'block';
            statusCode.innerText = 'SCANNING...';

            try {
                let html = '';

                if (currentModule === 'username') {
                    const u = query.replace('@', '');
                    const platforms = [
                        { name: "GitHub", url: `https://github.com/${u}` },
                        { name: "Telegram", url: `https://t.me/${u}` },
                        { name: "Reddit", url: `https://reddit.com/user/${u}` },
                        { name: "Steam", url: `https://steamcommunity.com/id/${u}` },
                        { name: "Twitch", url: `https://twitch.tv/${u}` },
                        { name: "Pinterest", url: `https://pinterest.com/${u}/` },
                        { name: "TikTok", url: `https://tiktok.com/@${u}` },
                        { name: "Spotify", url: `https://open.spotify.com/user/${u}` },
                        { name: "GitLab", url: `https://gitlab.com/${u}` },
                        { name: "Chess.com", url: `https://chess.com/member/${u}` },
                        { name: "Medium", url: `https://medium.com/@${u}` },
                        { name: "SoundCloud", url: `https://soundcloud.com/${u}` }
                    ];

                    statusCount.innerText = `ПЛАТФОРМ: ${platforms.length}`;
                    statusCode.innerText = 'COMPLETE';

                    html += '<div class="glass-deck">';
                    for (const p of platforms) {
                        html += `
                            <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="glass-card-item">
                                <div>
                                    <div class="card-inner-title">${p.name}</div>
                                    <div class="card-inner-sub">/${u}</div>
                                </div>
                                <svg class="card-external-arrow" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="7" y1="17" x2="17" y2="7"></line>
                                    <polyline points="7 7 17 7 17 17"></polyline>
                                </svg>
                            </a>
                        `;
                    }
                    html += '</div>';
                }
                else if (currentModule === 'dns') {
                    const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const types = ['A', 'AAAA', 'MX', 'TXT', 'NS'];
                    let found = 0;
                    let rows = '';

                    for (const t of types) {
                        try {
                            const res = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(cleanDomain)}&type=${t}`, {
                                headers: { 'Accept': 'application/dns-json' }
                            });
                            const data = await res.json();
                            if (data.Answer && data.Answer.length > 0) {
                                found++;
                                const valStr = data.Answer.map(a => a.data).join(', ');
                                rows += `
                                    <div class="data-unit-row">
                                        <span class="data-unit-key">${t}</span>
                                        <div class="data-unit-val-wrap">
                                            <span class="data-unit-val">${valStr}</span>
                                            <button class="copy-click-btn" title="Копировать" onclick="copyValue('${valStr.replace(/'/g, "\\'")}')">
                                                <svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                                            </button>
                                        </div>
                                    </div>
                                `;
                            }
                        } catch (e) {}
                    }

                    if (found > 0) {
                        html = `<div class="glass-data-table">${rows}</div>`;
                        statusCount.innerText = `ДОМЕН: ${cleanDomain}`;
                        statusCode.innerText = 'RESOLVED';
                    } else {
                        html = '<div class="empty-placeholder-box"><span>Записи DNS не обнаружены</span></div>';
                        statusCount.innerText = '0 СОВПАДЕНИЙ';
                        statusCode.innerText = 'EMPTY';
                    }
                }
                else if (currentModule === 'subdomains') {
                    const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const res = await fetch(`https://crt.sh/?q=%25.${encodeURIComponent(cleanDomain)}&output=json`);
                    const data = await res.json();
                    const subSet = new Set();

                    data.slice(0, 36).forEach(item => {
                        item.name_value.split('\n').forEach(s => {
                            s = s.trim().toLowerCase();
                            if (!s.includes('*') && s.endsWith(cleanDomain)) subSet.add(s);
                        });
                    });

                    const list = Array.from(subSet);
                    if (list.length > 0) {
                        statusCount.innerText = `НАЙДЕНО: ${list.length}`;
                        statusCode.innerText = 'EXTRACTED';

                        html += '<div class="glass-deck">';
                        for (const sub of list) {
                            html += `
                                <div class="glass-card-item" onclick="copyValue('${sub}')" style="cursor: pointer;">
                                    <span class="card-inner-title" style="font-family: var(--font-mono); font-size: 12.5px;">${sub}</span>
                                    <button class="copy-click-btn">
                                        <svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                                    </button>
                                </div>
                            `;
                        }
                        html += '</div>';
                    } else {
                        html = '<div class="empty-placeholder-box"><span>Поддомены в открытых CT-логах не найдены</span></div>';
                        statusCount.innerText = '0 СОВПАДЕНИЙ';
                        statusCode.innerText = 'EMPTY';
                    }
                }
                else if (currentModule === 'ip') {
                    const cleanTarget = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const res = await fetch(`https://freeipapi.com/api/json/${encodeURIComponent(cleanTarget)}`);
                    const data = await res.json();

                    statusCount.innerText = `IP: ${cleanTarget}`;
                    statusCode.innerText = 'RESOLVED';

                    const rows = [
                        ['IP Хоста', data.ipAddress || cleanTarget],
                        ['Локация', `${data.countryName || '—'}, ${data.cityName || '—'}`],
                        ['Индекс зоны', data.zipCode || '—'],
                        ['Таймзона', data.timeZone || '—'],
                        ['Версия IP', data.ipVersion ? `IPv${data.ipVersion}` : '—']
                    ];

                    html += '<div class="glass-data-table">';
                    rows.forEach(([k, v]) => {
                        html += `
                            <div class="data-unit-row">
                                <span class="data-unit-key">${k}</span>
                                <div class="data-unit-val-wrap">
                                    <span class="data-unit-val">${v}</span>
                                    <button class="copy-click-btn" onclick="copyValue('${v}')">
                                        <svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }
                else if (currentModule === 'email') {
                    const cleanEmail = query.trim().toLowerCase();
                    const domain = cleanEmail.split('@')[1] || '—';
                    const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail);

                    statusCount.innerText = cleanEmail;
                    statusCode.innerText = 'PARSED';

                    const rows = [
                        ['Целевой адрес', cleanEmail],
                        ['Доменная зона', domain],
                        ['Формат RFC 5322', isValid ? 'ВАЛИДЕН' : 'ОШИБКА ФОРМАТА']
                    ];

                    html += '<div class="glass-data-table">';
                    rows.forEach(([k, v]) => {
                        html += `
                            <div class="data-unit-row">
                                <span class="data-unit-key">${k}</span>
                                <div class="data-unit-val-wrap">
                                    <span class="data-unit-val">${v}</span>
                                    <button class="copy-click-btn" onclick="copyValue('${v}')">
                                        <svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                outputArea.innerHTML = html;
            } catch (e) {
                statusCode.innerText = 'FAILURE';
                outputArea.innerHTML = '<div class="empty-placeholder-box"><span>Ошибка сети или шлюза API</span></div>';
            } finally {
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
