<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherlock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --mono: 'JetBrains Mono', monospace;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(255, 255, 255, 0.25);
            --surface: rgba(18, 21, 28, 0.65);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #07080b;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.05) 0%, transparent 60%),
                radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 24px 24px;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        /* 🍏 ЕДИНОЕ ОКНО COMMAND CENTER */
        .app-window {
            width: 100%;
            max-width: 820px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            box-shadow: 
                0 40px 80px -15px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s var(--ease);
        }

        /* 🔝 ВЕРХНЯЯ СТРОКА ОКНА С НАВИГАЦИЕЙ */
        .window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.015);
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-icon svg {
            width: 15px;
            height: 15px;
            stroke: #ffffff;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        /* ТАБЫ В ШАПКЕ */
        .nav-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 3px;
            gap: 2px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s var(--ease);
        }

        .tab-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .tab-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.04);
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* 🔍 СТРОКА ПОИСКА SPOTLIGHT */
        .search-section {
            padding: 24px 28px 20px;
            border-bottom: 1px solid var(--border);
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 6px 8px 6px 18px;
            transition: all 0.25s var(--ease);
        }

        .search-bar:focus-within {
            border-color: var(--border-focus);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .search-icon {
            width: 18px;
            height: 18px;
            stroke: rgba(255, 255, 255, 0.35);
            margin-right: 12px;
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            outline: none;
            min-width: 0;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .search-action-btn {
            background: #ffffff;
            color: #07080b;
            border: none;
            border-radius: 11px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s var(--ease);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .search-action-btn:hover {
            background: #e2e8f0;
            transform: scale(1.02);
        }

        .search-action-btn:active {
            transform: scale(0.98);
        }

        .kbd-hint {
            font-family: var(--mono);
            font-size: 11px;
            opacity: 0.5;
        }

        /* ПРЕСЕТЫ */
        .presets-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .preset-title {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .preset-chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 4px 9px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.15s var(--ease);
        }

        .preset-chip:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* 📋 РАБОЧАЯ ОБЛАСТЬ ВЫДАЧИ */
        .content-area {
            padding: 24px 28px;
            min-height: 280px;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 16px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 10px;
        }

        .card-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.2s var(--ease);
        }

        .card-item:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
        }

        .card-link-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }

        .data-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px 16px;
        }

        .data-k {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.45);
        }

        .data-v {
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            max-width: 65%;
            text-align: right;
            word-break: break-all;
        }

        .placeholder-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            text-align: center;
            gap: 8px;
        }

        .spinner {
            display: none;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #07080b;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 820px) {
            .window-header { flex-direction: column; align-items: stretch; }
            .nav-tabs { overflow-x: auto; }
            body { padding: 16px; }
            .search-section, .content-area { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- 🍏 ЕДИНОЕ ОКНО ПРИЛОЖЕНИЯ -->
    <div class="app-window">
        <!-- ВЕРХНЯЯ ПАНЕЛЬ С ТАБАМИ -->
        <header class="window-header">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <span class="brand-name">Sherlock</span>
            </div>

            <nav class="nav-tabs">
                <button class="tab-btn active" onclick="switchTool(this, 'username', 'Введите никнейм (например: durov)...', ['durov', 'alex', 'developer'])">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span>Логин</span>
                </button>
                <button class="tab-btn" onclick="switchTool(this, 'dns', 'Введите домен (например: google.com)...', ['google.com', 'github.com', 'telegram.org'])">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                    <span>DNS</span>
                </button>
                <button class="tab-btn" onclick="switchTool(this, 'subdomains', 'Домен для поиска (например: tesla.com)...', ['tesla.com', 'spotify.com', 'uber.com'])">
                    <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                    <span>Субдомены</span>
                </button>
                <button class="tab-btn" onclick="switchTool(this, 'ip', 'IP адрес или хост (например: 1.1.1.1)...', ['1.1.1.1', '8.8.8.8', '9.9.9.9'])">
                    <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    <span>IP-инфо</span>
                </button>
                <button class="tab-btn" onclick="switchTool(this, 'email', 'Email адрес (например: name@domain.com)...', ['contact@gmail.com', 'support@apple.com'])">
                    <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    <span>Email</span>
                </button>
            </nav>
        </header>

        <!-- ПОИСКОВАЯ СТРОКА И ПРЕСЕТЫ -->
        <div class="search-section">
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="targetInput" class="search-input" placeholder="Введите никнейм (например: durov)..." autocomplete="off" spellcheck="false">
                <button class="search-action-btn" id="searchBtn" onclick="runSearch()">
                    <span id="btnText">Поиск</span>
                    <span class="kbd-hint" id="kbdHint">↵</span>
                    <div class="spinner" id="spinner"></div>
                </button>
            </div>

            <div class="presets-row" id="presetsRow">
                <span class="preset-title">Примеры:</span>
                <span class="preset-chip" onclick="applyPreset('durov')">durov</span>
                <span class="preset-chip" onclick="applyPreset('alex')">alex</span>
                <span class="preset-chip" onclick="applyPreset('developer')">developer</span>
            </div>
        </div>

        <!-- ОБЛАСТЬ РЕЗУЛЬТАТОВ -->
        <div class="content-area">
            <div class="status-header">
                <span id="resultsCount">Результаты анализа</span>
                <span id="scanStatus">Готов к работе</span>
            </div>
            <div id="resultsContent">
                <div class="placeholder-state">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <span>Введите запрос и нажмите «Поиск»</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTool = 'username';

        function applyPreset(val) {
            document.getElementById('targetInput').value = val;
            runSearch();
        }

        function switchTool(btn, tool, placeholder, presets) {
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            currentTool = tool;

            const input = document.getElementById('targetInput');
            input.placeholder = placeholder;
            input.value = '';
            document.getElementById('resultsCount').innerText = 'Результаты анализа';
            document.getElementById('scanStatus').innerText = 'Готов к работе';

            let presetsHtml = '<span class="preset-title">Примеры:</span>';
            presets.forEach(p => {
                presetsHtml += `<span class="preset-chip" onclick="applyPreset('${p}')">${p}</span>`;
            });
            document.getElementById('presetsRow').innerHTML = presetsHtml;
            
            document.getElementById('resultsContent').innerHTML = `
                <div class="placeholder-state">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <span>Введите запрос и нажмите «Поиск»</span>
                </div>
            `;
            input.focus();
        }

        document.getElementById('targetInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') runSearch();
        });

        async function runSearch() {
            const query = document.getElementById('targetInput').value.trim();
            if (!query) return;

            const btnText = document.getElementById('btnText');
            const kbdHint = document.getElementById('kbdHint');
            const spinner = document.getElementById('spinner');
            const resultsContent = document.getElementById('resultsContent');
            const resultsCount = document.getElementById('resultsCount');
            const scanStatus = document.getElementById('scanStatus');

            btnText.style.display = 'none';
            kbdHint.style.display = 'none';
            spinner.style.display = 'block';
            scanStatus.innerText = 'Сканирование...';

            try {
                let html = '';

                if (currentTool === 'username') {
                    const u = query.replace('@', '');
                    const platforms = [
                        { name: "GitHub", url: `https://github.com/${u}` },
                        { name: "Telegram", url: `https://t.me/${u}` },
                        { name: "Reddit", url: `https://reddit.com/user/${u}` },
                        { name: "Steam", url: `https://steamcommunity.com/id/${u}` },
                        { name: "Twitch", url: `https://twitch.tv/${u}` },
                        { name: "Pinterest", url: `https://pinterest.com/${u}/` },
                        { name: "TikTok", url: `https://tiktok.com/@${u}` },
                        { name: "Spotify", url: `https://open.spotify.com/user/${u}` },
                        { name: "GitLab", url: `https://gitlab.com/${u}` },
                        { name: "Chess.com", url: `https://chess.com/member/${u}` },
                        { name: "Medium", url: `https://medium.com/@${u}` },
                        { name: "SoundCloud", url: `https://soundcloud.com/${u}` }
                    ];

                    resultsCount.innerText = `Найдено профилей: ${platforms.length}`;
                    scanStatus.innerText = 'Завершено';
                    html += '<div class="results-grid">';
                    for (const p of platforms) {
                        html += `
                            <a href="${p.url}" target="_blank" class="card-item">
                                <span class="card-title">${p.name}</span>
                                <span class="card-link-text">Открыть ↗</span>
                            </a>
                        `;
                    }
                    html += '</div>';
                }
                else if (currentTool === 'dns') {
                    const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const types = ['A', 'AAAA', 'MX', 'TXT', 'NS'];
                    html += '<div class="data-list">';

                    for (const t of types) {
                        try {
                            const res = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(cleanDomain)}&type=${t}`, {
                                headers: { 'Accept': 'application/dns-json' }
                            });
                            const data = await res.json();
                            if (data.Answer && data.Answer.length > 0) {
                                const vals = data.Answer.map(a => a.data).join(', ');
                                html += `
                                    <div class="data-row">
                                        <span class="data-k">${t} запись</span>
                                        <span class="data-v">${vals}</span>
                                    </div>
                                `;
                            }
                        } catch (e) {}
                    }
                    html += '</div>';
                    resultsCount.innerText = `DNS: ${cleanDomain}`;
                    scanStatus.innerText = 'Завершено';
                }
                else if (currentTool === 'subdomains') {
                    const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const res = await fetch(`https://crt.sh/?q=%25.${encodeURIComponent(cleanDomain)}&output=json`);
                    const data = await res.json();
                    const subs = new Set();

                    data.slice(0, 40).forEach(item => {
                        item.name_value.split('\n').forEach(s => {
                            s = s.trim().toLowerCase();
                            if (!s.includes('*') && s.endsWith(cleanDomain)) subs.add(s);
                        });
                    });

                    const list = Array.from(subs);
                    if (list.length > 0) {
                        resultsCount.innerText = `Поддоменов: ${list.length}`;
                        scanStatus.innerText = 'Завершено';
                        html += '<div class="results-grid">';
                        for (const s of list) {
                            html += `
                                <div class="card-item" style="cursor: default;">
                                    <span class="card-title" style="font-family: var(--mono); font-size: 13px;">${s}</span>
                                </div>
                            `;
                        }
                        html += '</div>';
                    } else {
                        resultsCount.innerText = 'Результаты';
                        scanStatus.innerText = '0 совпадений';
                        html = '<div class="placeholder-state"><span>Поддоменов в открытых SSL-реестрах не найдено.</span></div>';
                    }
                }
                else if (currentTool === 'ip') {
                    const cleanTarget = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const res = await fetch(`https://freeipapi.com/api/json/${encodeURIComponent(cleanTarget)}`);
                    const data = await res.json();

                    resultsCount.innerText = `IP: ${cleanTarget}`;
                    scanStatus.innerText = 'Завершено';
                    html += `
                        <div class="data-list">
                            <div class="data-row"><span class="data-k">IP адрес</span><span class="data-v">${data.ipAddress || cleanTarget}</span></div>
                            <div class="data-row"><span class="data-k">Страна</span><span class="data-v">${data.countryName || '—'}</span></div>
                            <div class="data-row"><span class="data-k">Город</span><span class="data-v">${data.cityName || '—'}</span></div>
                            <div class="data-row"><span class="data-k">Индекс</span><span class="data-v">${data.zipCode || '—'}</span></div>
                            <div class="data-row"><span class="data-k">Версия IP</span><span class="data-v">${data.ipVersion ? 'IPv' + data.ipVersion : '—'}</span></div>
                        </div>
                    `;
                }
                else if (currentTool === 'email') {
                    const cleanEmail = query.trim().toLowerCase();
                    const domain = cleanEmail.split('@')[1] || 'Не указан';
                    resultsCount.innerText = 'Сведения о почте';
                    scanStatus.innerText = 'Завершено';
                    html += `
                        <div class="data-list">
                            <div class="data-row"><span class="data-k">Адрес</span><span class="data-v">${cleanEmail}</span></div>
                            <div class="data-row"><span class="data-k">Почтовый домен</span><span class="data-v">${domain}</span></div>
                            <div class="data-row"><span class="data-k">Формат синтаксиса</span><span class="data-v">${cleanEmail.includes('@') ? 'Корректный' : 'Ошибка формата'}</span></div>
                        </div>
                    `;
                }

                resultsContent.innerHTML = html;
            } catch (e) {
                scanStatus.innerText = 'Ошибка';
                resultsContent.innerHTML = '<div class="placeholder-state"><span>Не удалось получить данные. Проверьте интернет.</span></div>';
            } finally {
                btnText.style.display = 'block';
                kbdHint.style.display = 'inline';
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
