<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherlock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --mono: 'JetBrains Mono', monospace;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #07090e;
            background-image: 
                radial-gradient(circle at 50% 0%, #151a24 0%, transparent 55%),
                radial-gradient(circle at 100% 100%, #0d1017 0%, transparent 40%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 24px 120px;
        }

        /* Верхняя панель */
        .header {
            width: 100%;
            max-width: 1080px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 32px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-icon svg {
            width: 17px;
            height: 17px;
            stroke: #ffffff;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 99rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        /* Двухколоночный интерфейс */
        .workspace-grid {
            width: 100%;
            max-width: 1080px;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            align-items: start;
        }

        /* Стеклянные панели */
        .glass-panel {
            position: relative;
            border-radius: 24px;
            background: 
                linear-gradient(150deg, rgba(17, 21, 30, 0.7) 0%, rgba(9, 11, 16, 0.85) 100%) padding-box,
                linear-gradient(135deg, 
                    rgba(255, 255, 255, 0.6) 0%, 
                    rgba(255, 255, 255, 0.2) 30%, 
                    rgba(255, 255, 255, 0.02) 60%, 
                    rgba(255, 255, 255, 0.25) 100%) border-box;
            border: 1px solid transparent;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.8),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.35);
            padding: 32px 28px;
        }

        .panel-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.4px;
            margin-bottom: 6px;
        }

        .panel-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .glass-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 15px 18px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }

        .glass-input:focus {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .search-btn {
            background: #ffffff;
            color: #07090e;
            border: none;
            border-radius: 14px;
            padding: 15px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s var(--ease);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.25);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        /* Панель выдачи результатов */
        .results-panel {
            min-height: 260px;
        }

        .results-header {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .card-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: 
                linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.4)) padding-box,
                linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.02)) border-box;
            border: 1px solid transparent;
            border-radius: 14px;
            padding: 14px 16px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.2s var(--ease);
        }

        .card-link:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .card-name {
            font-size: 13px;
            font-weight: 600;
        }

        .card-action {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .data-table {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 14px 16px;
        }

        .data-k {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.45);
        }

        .data-v {
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 500;
            color: #ffffff;
            max-width: 65%;
            text-align: right;
            word-break: break-all;
        }

        .placeholder-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            text-align: center;
            gap: 8px;
        }

        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #07090e;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Нижний плавающий стеклянный док */
        .menu {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 500px;
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            background: rgba(14, 18, 26, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.6),
                inset 0 1px 1px rgba(255, 255, 255, 0.3);
            padding: 6px;
            border-radius: 99rem;
            display: flex;
            justify-content: center;
            gap: 6px;
            z-index: 100;
        }

        .menu a {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1 1 0;
            min-width: 0;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            padding: 10px 4px;
            border-radius: 999rem;
            cursor: pointer;
            transition: all 0.18s var(--ease);
        }

        .menu a:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.08);
        }

        .menu a svg {
            width: 1.25rem;
            height: 1.25rem;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .menu a span {
            font-size: 0.75rem;
            font-weight: 600;
            line-height: 1;
            margin-top: 5px;
        }

        .menu a.active {
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 860px) {
            .workspace-grid { grid-template-columns: 1fr; }
            body { padding: 20px 16px 120px; }
            .glass-panel { padding: 24px 20px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
            <span class="brand-title">Sherlock</span>
        </div>
        <div class="status-pill">
            <span class="status-dot"></span>
            <span>Готов к работе</span>
        </div>
    </header>

    <main class="workspace-grid">
        <!-- Панель ввода -->
        <section class="glass-panel">
            <h1 class="panel-title" id="toolTitle">Поиск по никнейму</h1>
            <p class="panel-desc" id="toolDesc">Проверка существования профиля на популярных онлайн-платформах</p>

            <div class="input-group">
                <input type="text" id="targetInput" class="glass-input" placeholder="Введите логин (например: durov)..." autocomplete="off" spellcheck="false">
                <button class="search-btn" id="searchBtn" onclick="runSearch()">
                    <span id="btnText">Начать поиск</span>
                    <div class="spinner" id="spinner"></div>
                </button>
            </div>
        </section>

        <!-- Панель результатов -->
        <section class="glass-panel results-panel">
            <div class="results-header">
                <span>Результаты</span>
                <span id="scanStatus" style="font-size: 11px; font-weight: 500;">Ожидание</span>
            </div>
            <div id="resultsContent">
                <div class="placeholder-state">
                    <span>Введите запрос слева и нажмите «Начать поиск»</span>
                </div>
            </div>
        </section>
    </main>

    <!-- Нижняя навигация -->
    <nav class="menu">
        <a class="active" onclick="switchTool(this, 'username', 'Поиск по никнейму', 'Проверка существования профиля на популярных онлайн-платформах', 'Введите логин (например: durov)...')">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Логин</span>
        </a>
        <a onclick="switchTool(this, 'dns', 'DNS записи домена', 'Получение A, MX, TXT и NS записей через Cloudflare DNS', 'Введите домен (например: google.com)...')">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            <span>DNS</span>
        </a>
        <a onclick="switchTool(this, 'subdomains', 'Поиск поддоменов', 'Анализ открытых записей SSL-сертификатов', 'Домен для анализа (например: tesla.com)...')">
            <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            <span>Поддомены</span>
        </a>
        <a onclick="switchTool(this, 'ip', 'Геолокация IP', 'Определение страны, города и сетевой информации хоста', 'IP адрес или хост (например: 1.1.1.1)...')">
            <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <span>IP-инфо</span>
        </a>
        <a onclick="switchTool(this, 'email', 'Анализ почты', 'Проверка синтаксиса и почтового шлюза домена', 'Email адрес (например: name@domain.com)...')">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <span>Email</span>
        </a>
    </nav>

    <script>
        let currentTool = 'username';

        function switchTool(btn, tool, title, desc, placeholder) {
            document.querySelectorAll('.menu a').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            currentTool = tool;

            document.getElementById('toolTitle').innerText = title;
            document.getElementById('toolDesc').innerText = desc;
            const input = document.getElementById('targetInput');
            input.placeholder = placeholder;
            input.value = '';
            document.getElementById('resultsContent').innerHTML = `
                <div class="placeholder-state">
                    <span>Введите запрос слева и нажмите «Начать поиск»</span>
                </div>
            `;
            document.getElementById('scanStatus').innerText = 'Ожидание';
            input.focus();
        }

        document.getElementById('targetInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') runSearch();
        });

        async function runSearch() {
            const query = document.getElementById('targetInput').value.trim();
            if (!query) return;

            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const resultsContent = document.getElementById('resultsContent');
            const scanStatus = document.getElementById('scanStatus');

            btnText.style.display = 'none';
            spinner.style.display = 'block';
            scanStatus.innerText = 'Поиск...';

            try {
                let html = '';

                if (currentTool === 'username') {
                    const u = query.replace('@', '');
                    const platforms = [
                        { name: "GitHub", url: `https://github.com/${u}` },
                        { name: "Telegram", url: `https://t.me/${u}` },
                        { name: "Reddit", url: `https://reddit.com/user/${u}` },
                        { name: "Steam", url: `https://steamcommunity.com/id/${u}` },
                        { name: "Twitch", url: `https://twitch.tv/${u}` },
                        { name: "Pinterest", url: `https://pinterest.com/${u}/` },
                        { name: "TikTok", url: `https://tiktok.com/@${u}` },
                        { name: "Spotify", url: `https://open.spotify.com/user/${u}` },
                        { name: "GitLab", url: `https://gitlab.com/${u}` },
                        { name: "Chess.com", url: `https://chess.com/member/${u}` },
                        { name: "Medium", url: `https://medium.com/@${u}` },
                        { name: "SoundCloud", url: `https://soundcloud.com/${u}` }
                    ];

                    scanStatus.innerText = `Найдено: ${platforms.length}`;
                    html += '<div class="results-grid">';
                    for (const p of platforms) {
                        html += `
                            <a href="${p.url}" target="_blank" class="card-link">
                                <span class="card-name">${p.name}</span>
                                <span class="card-action">Открыть ↗</span>
                            </a>
                        `;
                    }
                    html += '</div>';
                }
                else if (currentTool === 'dns') {
                    const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const types = ['A', 'AAAA', 'MX', 'TXT', 'NS'];
                    html += '<div class="data-table">';

                    for (const t of types) {
                        try {
                            const res = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(cleanDomain)}&type=${t}`, {
                                headers: { 'Accept': 'application/dns-json' }
                            });
                            const data = await res.json();
                            if (data.Answer && data.Answer.length > 0) {
                                const vals = data.Answer.map(a => a.data).join(', ');
                                html += `
                                    <div class="data-row">
                                        <span class="data-k">${t} запись</span>
                                        <span class="data-v">${vals}</span>
                                    </div>
                                `;
                            }
                        } catch (e) {}
                    }
                    html += '</div>';
                    scanStatus.innerText = 'Завершено';
                }
                else if (currentTool === 'subdomains') {
                    const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const res = await fetch(`https://crt.sh/?q=%25.${encodeURIComponent(cleanDomain)}&output=json`);
                    const data = await res.json();
                    const subs = new Set();

                    data.slice(0, 40).forEach(item => {
                        item.name_value.split('\n').forEach(s => {
                            s = s.trim().toLowerCase();
                            if (!s.includes('*') && s.endsWith(cleanDomain)) subs.add(s);
                        });
                    });

                    const list = Array.from(subs);
                    if (list.length > 0) {
                        scanStatus.innerText = `Найдено: ${list.length}`;
                        html += '<div class="results-grid">';
                        for (const s of list) {
                            html += `
                                <div class="card-link" style="cursor: default;">
                                    <span class="card-name" style="font-family: var(--mono); font-size: 13px;">${s}</span>
                                </div>
                            `;
                        }
                        html += '</div>';
                    } else {
                        scanStatus.innerText = '0 совпадений';
                        html = '<div class="placeholder-state"><span>Поддоменов не обнаружено.</span></div>';
                    }
                }
                else if (currentTool === 'ip') {
                    const cleanTarget = query.replace('https://', '').replace('http://', '').split('/')[0].trim();
                    const res = await fetch(`https://freeipapi.com/api/json/${encodeURIComponent(cleanTarget)}`);
                    const data = await res.json();

                    scanStatus.innerText = 'Завершено';
                    html += `
                        <div class="data-table">
                            <div class="data-row"><span class="data-k">IP адрес</span><span class="data-v">${data.ipAddress || cleanTarget}</span></div>
                            <div class="data-row"><span class="data-k">Страна</span><span class="data-v">${data.countryName || '—'}</span></div>
                            <div class="data-row"><span class="data-k">Город</span><span class="data-v">${data.cityName || '—'}</span></div>
                            <div class="data-row"><span class="data-k">Индекс</span><span class="data-v">${data.zipCode || '—'}</span></div>
                            <div class="data-row"><span class="data-k">Версия IP</span><span class="data-v">${data.ipVersion ? 'IPv' + data.ipVersion : '—'}</span></div>
                        </div>
                    `;
                }
                else if (currentTool === 'email') {
                    const cleanEmail = query.trim().toLowerCase();
                    const domain = cleanEmail.split('@')[1] || 'Не указан';
                    scanStatus.innerText = 'Завершено';
                    html += `
                        <div class="data-table">
                            <div class="data-row"><span class="data-k">Адрес</span><span class="data-v">${cleanEmail}</span></div>
                            <div class="data-row"><span class="data-k">Почтовый домен</span><span class="data-v">${domain}</span></div>
                            <div class="data-row"><span class="data-k">Формат</span><span class="data-v">${cleanEmail.includes('@') ? 'Корректный' : 'Ошибка формата'}</span></div>
                        </div>
                    `;
                }

                resultsContent.innerHTML = html;
            } catch (e) {
                scanStatus.innerText = 'Ошибка';
                resultsContent.innerHTML = '<div class="placeholder-state"><span>Не удалось получить данные. Проверьте подключение к сети.</span></div>';
            } finally {
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
